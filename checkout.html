
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background: white;
    }
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 22px 28px;
    }
    .btn-retourccp {
      margin-top: 31px;
      margin-left: -18px;
      font-size: 12px;
      font-weight: 300;
      color: black;
      background: none;
      border: none;
      cursor: pointer;
    }
    #checkout-date {
      font-size: 12px;
      font-weight: 300;
      color: black;
      margin: 0 16px;
    }
    #checkout-article-count {
      font-size: 12px;
      font-weight: 300;
      margin: 12px 16px;
    }
    .carousel {
      margin-top: -10px;
      display: flex;
      overflow-x: auto;
      gap: 16px;
      padding: 16px;
    }
    .carousel div {
      width: 120px;
      height: 180px;
      background: #eee;
    }
    .address-header, .payment-header, .shipping-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 300;
      cursor: pointer;
    }

    .address-header {
    margin-bottom: 6px;
    }

    .payment-header {
    margin-top: -4px;
    margin-bottom: 32px;
    }

   
    .cart-footer {
       position: fixed;       /* ✅ Toujours collé à l’écran */
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: white;
      z-index: 1000;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      margin-top: 10px;
    }
    .continue-button {
      width: 100%;
      background: black;
      color: white;
      padding: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 300;
      border: none;
      cursor: pointer;
    }
    .cart-total {
      font-size: 14px;
      font-weight: 300;
    }
    .cart-note {
      font-size: 12px;
      color: #555;
      font-weight: 300;
    }
    .cart-footer-left {
  width: 40vw; /* même largeur que les images produit */
}

  </style>
</head>
<body>

<div id="checkout-page">
  <div class="header">
    <button class="btn-retourccp" onclick="window.location.href='panier-favoris.html'">RETOUR</button>

  </div>

  <p id="checkout-date"></p>
  <p id="checkout-article-count">ARTICLES DANS LE PANIER : </p>

  <div class="carousel" id="checkout-carousel">
    <div></div><div></div><div></div>
  </div>

  <div class="address-header" onclick="openAddressPage()">
    <span class="address-title">LIVRAISON</span>
    <span class="address-arrow">›</span>
  </div>

  <div id="address-summary" style="display: none; margin-top: -37px; padding: 16px; font-size:12px; font-weight:400; text-transform: uppercase;">
    <h3 style="font-size: 12px; font-weight: 300; margin-bottom: 2px;"></h3>
    <p id="displayed-address" class="displayed-address"></p>
  </div>

  <div id="payment-header" class="payment-header" onclick="goToPaymentPage()">
    <span class="payment-title">PAIEMENT</span>
    <span class="payment-arrow">›</span>
  </div>

  <div id="payment-summary" style="padding: 16px; display: none; margin-top: -38px; font-size: 12px; font-weight: 400; text-transform: capitalize; margin-left: 16px;"></div>
  <p id="selected-payment" style="font-size: 12px; font-weight: 400; margin-top: -32px;margin-left: 16px;"></p>

  <div class="shipping-header" onclick="openShippingPage()">
    <span>EXPÉDITION</span>
    <span>›</span>
  </div>

  <div id="shipping-summary" style="display: none; margin-top: -16px; margin-left: 16px; font-weight: 500;">
    <p id="selected-shipping" style="font-size: 12px; font-weight: 400; margin-bottom: 160px;"></p>
  </div>

  <div class="cart-footer" id="checkout-footer">
    <div class="cart-footer-left">
      <button class="continue-button" onclick="finalizeOrder()">COMMANDER</button>
    </div>
    <div class="cart-footer-right" style="text-align: right; margin-right: 32px; ">
      <div class="cart-total" id="checkout-total" data-original-total="1440">€1440.00</div>
      <div class="cart-note">* Taxes comprises</div>
    </div>
  </div>
  
  
</div>


<script>
   window.openAddressPage = function () {
    window.location.href = "addresselivraison.html";
  };

   window.goToPaymentPage = function () {
    window.location.href = "payment.html";
  };

  window.openShippingPage = function () {
    window.location.href = "expedition.html";
  };
  
  
  
document.addEventListener("DOMContentLoaded", function () {

    // Adresse
    const address = localStorage.getItem("tokomi_address");
    if (address) {
      const display = document.getElementById("displayed-address");
      const summary = document.getElementById("address-summary");
      if (display) display.textContent = address;
      if (summary) summary.style.display = "block";
      localStorage.setItem("tokomi_summary_address", address);
    }

    // Paiement
    const paymentMethod = localStorage.getItem("tokomi_payment_method");
    if (paymentMethod) {
      const container = document.getElementById("payment-summary");
      const text = document.getElementById("selected-payment");
      if (text) text.textContent = paymentMethod.toUpperCase();
      if (container) container.style.display = "block";
    }

    // Expédition
    const shippingOption = localStorage.getItem("tokomi_shipping_option");
    if (shippingOption) {
      const container = document.getElementById("shipping-summary");
      const text = document.getElementById("selected-shipping");
      if (container && text) {
      text.textContent = shippingOption.toUpperCase();
      container.style.display = "block";
      } else {
        console.error("❌ Élément introuvable : shipping-summary ou selected-shipping.");
      }
   }

function renderCheckoutFromLS() {
  // ---- Compteur d’articles
  const countEl = document.getElementById("checkout-article-count");
  const countLS = parseInt(localStorage.getItem('tokomi_cart_count'));
  if (!isNaN(countLS)) {
    if (countEl) countEl.textContent = `ARTICLES DANS LE PANIER : ${countLS}`;
  } else {
    // Fallback si pas de valeur persistée : recompute depuis le panier
    const items = JSON.parse(localStorage.getItem('tokomi_cart_items')) || [];
    const computedCount = items.reduce((n, it) => n + (it.quantity || 1), 0);
    if (countEl) countEl.textContent = `ARTICLES DANS LE PANIER : ${computedCount}`;
  }

  // ---- Totaux synchronisés
  const subtotalLS = parseFloat(localStorage.getItem('tokomi_subtotal'));
  const shippingLS = parseFloat(localStorage.getItem('tokomi_shipping_price'));
  const totalEl = document.getElementById("checkout-total");

  if (!isNaN(subtotalLS)) {
    const total = (subtotalLS || 0) + (isNaN(shippingLS) ? 0 : shippingLS);
    if (totalEl) totalEl.textContent = `€${total.toFixed(2)}`;
  } else {
    // Fallback si persistTotals n’a pas encore tourné
    const cart = JSON.parse(localStorage.getItem('tokomi_cart_items')) || [];
    let subtotal = 0;
    cart.forEach(it => {
      const q = it.quantity || 1;
      const p = parseFloat(it.price) || 0;
      subtotal += q * p;
    });
    const ship = isNaN(shippingLS) ? 0 : shippingLS;
    if (totalEl) totalEl.textContent = `€${(subtotal + ship).toFixed(2)}`;
  }

  // ---- Résumé expédition (si dispo)
  const shippingDate = localStorage.getItem("tokomi_shipping_date");
  if (shippingDate) {
    const shipBox = document.getElementById("shipping-summary");
    const shipText = document.getElementById("selected-shipping");
    const sp = isNaN(shippingLS) ? 0 : shippingLS;
    if (shipBox && shipText) {
      shipText.textContent = `${shippingDate} – €${sp.toFixed(2)}`;
      shipBox.style.display = "block";
    }
  }

  // ---- Carrousel (si tu stockes les images)
  const products = JSON.parse(localStorage.getItem('tokomi_cart_products')) || [];
  const carousel = document.getElementById("checkout-carousel");
  if (carousel) {
    carousel.innerHTML = "";
    products.forEach(src => {
      const div = document.createElement("div");
      div.style.backgroundImage = `url('${src}')`;
      div.style.backgroundSize = "cover";
      div.style.backgroundPosition = "center";
      div.style.width = "120px";
      div.style.height = "180px";
      carousel.appendChild(div);
    });
  }

  // ---- Date du jour
  const checkoutDateElem = document.getElementById("checkout-date");
  if (checkoutDateElem) {
    const jours = ["DIMANCHE","LUNDI","MARDI","MERCREDI","JEUDI","VENDREDI","SAMEDI"];
    const mois  = ["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
    const d = new Date();
    checkoutDateElem.textContent = `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]}`;
    localStorage.setItem("tokomi_checkout_date_iso", d.toISOString().slice(0,10));
  }
}

// 1) Premier rendu à l’ouverture
renderCheckoutFromLS();

// 2) Si d’autres onglets/pages modifient le localStorage
window.addEventListener('storage', renderCheckoutFromLS);

// 3) Quand l’onglet redevient actif (utile si on revient d’une autre page)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) renderCheckoutFromLS();
});
});
</script>
<script>
/* ====== KEYS ====== */
const ORDERS_KEY  = 'tokomi_orders';
const PENDING_KEY = 'tokomi_pending_order';
const CART_KEY    = 'tokomi_cart_items';

/* Numéro de commande unique */
function generateOrderNumber() {
  const now = new Date();
  const y = now.getFullYear().toString().slice(-2);
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const random = Math.floor(Math.random() * 9000) + 1000;
  return `TK${y}${m}${d}${h}${min}${s}${random}`;
}

/* Construit la commande à partir du panier + résumés */
function prepareOrderFromCart(orderNumber) {
  const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');

  // totaux
  const subtotalLS    = parseFloat(localStorage.getItem('tokomi_subtotal'));
  const shippingLS    = parseFloat(localStorage.getItem('tokomi_shipping_price'));
  const subtotal = !isNaN(subtotalLS)
    ? subtotalLS
    : cart.reduce((sum, it) => sum + (parseFloat(it.price)||0) * (it.quantity||1), 0);
  const shipping = isNaN(shippingLS) ? 0 : shippingLS;
  const total = subtotal + shipping;

  // infos de résumé
  const address       = localStorage.getItem('tokomi_address') || '';
  const shippingOpt   = localStorage.getItem('tokomi_shipping_option') || '';
  const shippingDate  = localStorage.getItem('tokomi_shipping_date') || '';
  const paymentMethod = localStorage.getItem('tokomi_payment_method') || '';

  return {
    id: orderNumber,
    number: orderNumber,
    date: new Date().toISOString(),
    status: 'En cours', // passera à "Confirmée" sur confirmation.html
    totals: { subtotal, shipping, total },
    address,
    shipping: { option: shippingOpt, date: shippingDate, price: shipping },
    payment: paymentMethod,
    products: cart.map(it => ({
      brand: it.brand || it.marque || '',
      name:  it.name  || it.titre  || '',
      price: Number(it.price || 0),
      quantity: it.quantity || 1,
      image: it.image || it.img || ''
    }))
  };
}

/* Bouton COMMANDER */
function finalizeOrder() {
  const orderNumber = generateOrderNumber();
  localStorage.setItem('tokomi_order_number', orderNumber); // utile pour l’afficher sur confirmation

  const pending = prepareOrderFromCart(orderNumber);
  localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); // staging

  // ta logique existante : on passe par loading.html
  window.location.href = 'loading.html';
}
</script>


</body>
</html>
