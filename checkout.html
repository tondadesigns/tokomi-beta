
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background: white;
    }
    .header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 22px 28px;
    }
    .btn-retourccp {
      margin-top: 31px;
      margin-left: -18px;
      font-size: 12px;
      font-weight: 300;
      color: black;
      background: none;
      border: none;
      cursor: pointer;
    }
    #checkout-date {
      font-size: 12px;
      font-weight: 300;
      color: black;
      margin: 0 16px;
    }
    #checkout-article-count {
      font-size: 12px;
      font-weight: 300;
      margin: 12px 16px;
    }
    .carousel {
      margin-top: -10px;
      display: flex;
      overflow-x: auto;
      gap: 16px;
      padding: 16px;
    }
    .carousel div {
      width: 120px;
      height: 180px;
      background: #eee;
    }
    .address-header, .payment-header, .shipping-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 300;
      cursor: pointer;
    }

    .address-header {
    margin-bottom: 6px;
    }

    .payment-header {
    margin-bottom: 32px;
    }

    .shipping-header {
    margin-bottom: 201px;
    }
    .cart-footer {
      position: sticky;
      bottom: 0;
      background: white;
      z-index: 10;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      margin-top: 10px;
    }
    .continue-button {
      width: 100%;
      background: black;
      color: white;
      padding: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 300;
      border: none;
      cursor: pointer;
    }
    .cart-total {
      font-size: 14px;
      font-weight: 300;
    }
    .cart-note {
      font-size: 12px;
      color: #555;
      font-weight: 300;
    }
    .cart-footer-left {
  width: 40vw; /* même largeur que les images produit */
}
  </style>
</head>
<body>

<div id="checkout-page">
  <div class="header">
    <button class="btn-retourccp" onclick="window.location.href='panier-favoris.html'">RETOUR</button>

  </div>

  <p id="checkout-date">LUNDI 28 JUILLET</p>
  <p id="checkout-article-count">ARTICLES DANS LE PANIER : 3</p>

  <div class="carousel" id="checkout-carousel">
    <div></div><div></div><div></div>
  </div>

  <div class="address-header" onclick="openAddressPage()">
    <span class="address-title">LIVRAISON</span>
    <span class="address-arrow">›</span>
  </div>

  <div id="address-summary" style="display: none; margin-top: -40px; padding: 16px; font-size:12px; font-weight:400; text-transform: uppercase;">
    <h3 style="font-size: 12px; font-weight: 300; margin-bottom: 2px;"></h3>
    <p id="displayed-address" class="displayed-address"></p>
  </div>

  <div id="payment-header" class="payment-header" onclick="goToPaymentPage()">
    <span class="payment-title">PAIEMENT</span>
    <span class="payment-arrow">›</span>
  </div>

  <div id="payment-summary" style="padding: 16px; display: none; margin-top: -38px; font-size: 12px; font-weight: 400; text-transform: capitalize; margin-left: 16px;"></div>
  <p id="selected-payment" style="font-size: 12px; font-weight: 400; margin-top: -32px;margin-left: 16px;"></p>

  <div class="shipping-header" onclick="openShippingPage()">
    <span>EXPÉDITION</span>
    <span>›</span>
  </div>

  <div id="shipping-summary" style="display: none; margin-top: -32px; margin-left: 4px; font-weight: 400;">
    <p id="selected-shipping" style="font-size: 12px; font-weight: 400; margin-bottom: 160px;"></p>
  </div>

  <div class="cart-footer" id="checkout-footer">
    <div class="cart-footer-left">
      <button class="continue-button" onclick="finalizeOrder()">COMMANDER</button>
    </div>
    <div class="cart-footer-right" style="text-align: right;">
      <div class="cart-total" id="checkout-total" data-original-total="1440">€1440.00</div>
      <div class="cart-note">* Taxes comprises</div>
    </div>
  </div>
  
  <div id="loading-screen" style="
    position: fixed;
    inset: 0;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: white;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  ">
    <img src="./tokomi-loader.gif" alt="Chargement..." style="width: 120px; height: auto; animation: spin 2s linear infinite;" />
  </div>
</div>


<script>
  function openAddressPage() {
    window.location.href = "addresselivraison.html";
  }

  function goToPaymentPage() {
    window.location.href = "payment.html";
  }

  function openShippingPage() {
    window.location.href = "expedition.html";
  }
  
  
  
document.addEventListener("DOMContentLoaded", function () {
    // Adresse
    const address = localStorage.getItem("tokomi_address");
    if (address) {
      const display = document.getElementById("displayed-address");
      const summary = document.getElementById("address-summary");
      display.textContent = address;
      summary.style.display = "block";
    }

    // Paiement
    const paymentMethod = localStorage.getItem("tokomi_payment_method");
    if (paymentMethod) {
      const container = document.getElementById("payment-summary");
      const text = document.getElementById("selected-payment");
      text.textContent = paymentMethod.toUpperCase();
      container.style.display = "block";
    }

    // Expédition
    const shippingOption = localStorage.getItem("tokomi_shipping_option");
    if (shippingOption) {
      const container = document.getElementById("shipping-summary");
      const text = document.getElementById("selected-shipping");
      if (container && text) {
      text.textContent = shippingOption.toUpperCase();
      container.style.display = "block";
      } else {
        console.error("❌ Élément introuvable : shipping-summary ou selected-shipping.");
      }
    }
  });
  
</script>

  
</body>
</html>
