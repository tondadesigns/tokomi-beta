
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Confirmation de commande</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      padding: 32px;
      background: #fff;
      color: #111;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: 600;
      margin-top: 120px;
      margin-bottom: 122px;
    }
    .section {
      margin-bottom: 30px;
      
    }
    .label {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .value {
      font-size: 22px;
      font-weight: 300;
      text-transform: none;
      margin-bottom: 18px;
    }
    .section:nth-of-type(2) .value {
      text-transform: none;
      margin-top: 0px;
  margin-bottom: 40px; /* après date estimée */
}
.section:nth-of-type(3) .value {
  margin-bottom: 40px; /* après adresse livraison */
}

    .summary {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 30px;
      font-weight: 300;
      text-transform: none;
    }
    .total {
      border-top: 1px solid #ddd;
      padding-top: 8px;
      font-size: 30px;
      font-weight: 600;
    }
  </style>
</head>
<body>
    <header style="display: flex; justify-content: center; align-items: center; padding: 20px 0; margin">
    <img src="./logo.png" alt="Tokomi Logo" style="height: 60px;">
  </header>
  <h1>MERCI POUR VOTRE COMMANDE !</h1>
  <div class="section">
    <div class="label">COMMANDE</div>
    <div class="value">#000000</div>
    <div class="value" style: margin-bottom: 10px;>Vous recevrez un numéro de suivi dès que votre commande aura été expédiée.</div>
  </div>
  <div class="section">
    <div class="label">ARRIVÉE ESTIMÉE</div>
    <p id="estimated-date" class="value"></p>
  </div>
  <div class="section">
    <div class="label">LIVRAISON</div>
    <div class="value" id="confirmation-address"></div>
  </div>
  <div class="section">
    <div class="label">RÉSUMÉ</div>
    <div class="summary"><span>SOUS-TOTAL</span><span id="subtotal">€0.00</span></div>
    <div class="summary"><span>EXPÉDITION</span><span id="shipping-fee">€0.00</span></div>
    <div class="summary total"><span>TOTAL</span><span id="total">€0.00</span></div>
  </div>


  <script>
  document.getElementById("order-number").textContent = localStorage.getItem('tokomi_order_number') || "#000000";

</script>


<script>

document.addEventListener("DOMContentLoaded", () => {
  const date = localStorage.getItem("tokomi_shipping_date") || "À CONFIRMER";
  const price = localStorage.getItem("tokomi_shipping_price") || "€0.00";
  const total = localStorage.getItem("tokomi_total") || "€0.00";


  document.querySelector(".summary:nth-of-type(1) span:last-child").textContent = localStorage.getItem("tokomi_cart_total") || "€0.00";
  document.querySelector(".summary:nth-of-type(2) span:last-child").textContent = price;
  document.querySelector(".summary.total span:last-child").textContent = `€${total}`;
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // ---------- Helpers ----------
  const money = n => `€${(+n || 0).toFixed(2)}`;
  const parsePrice = (s) => {
    if (!s) return 0;
    const m = String(s).match(/([0-9]+[.,]?[0-9]*)/);
    return m ? parseFloat(m[1].replace(',', '.')) : 0;
  };



  // ---------- 3) PRIX EXPÉDITION ----------
  // Priorités : tokomi_shipping_price > extrait de selectedShipping > extrait de tokomi_shipping_option
  let shipPrice = localStorage.getItem("tokomi_shipping_price");
  let shippingNum = parsePrice(shipPrice);

  if (!shippingNum) {
    const selectedShipping = localStorage.getItem("selectedShipping");
    if (selectedShipping) shippingNum = parsePrice(selectedShipping);
  }
  if (!shippingNum) {
    const shipOpt = localStorage.getItem("tokomi_shipping_option");
    if (shipOpt) shippingNum = parsePrice(shipOpt);
  }

  // ---------- 4) SOUS-TOTAL ----------
  // Priorités : tokomi_subtotal (persisté depuis panier) > recalcul depuis tokomi_cart_items
  let subtotal = parseFloat(localStorage.getItem("tokomi_subtotal"));
  if (isNaN(subtotal)) {
    const items = JSON.parse(localStorage.getItem("tokomi_cart_items") || "[]");
    subtotal = items.reduce((sum, it) => {
      const q = it.quantity || 1;
      const p = parseFloat(it.price) || 0;
      return sum + q * p;
    }, 0);
  }

  // ---------- 5) TOTAL ----------
  // Priorités : tokomi_total (s’il a été persisté) sinon subtotal + expédition
  let total = parseFloat(localStorage.getItem("tokomi_total"));
  if (isNaN(total)) total = subtotal + (shippingNum || 0);

  // ---------- 6) Rendu montants ----------
  const elSub = document.getElementById("subtotal");
  const elShip = document.getElementById("shipping-fee");
  const elTot = document.getElementById("total");
  if (elSub) elSub.textContent = money(subtotal);
  if (elShip) elShip.textContent = money(shippingNum);
  if (elTot) elTot.textContent = money(total);

  // ---------- 7) (Optionnel) N° commande si stocké ----------
  const orderEl = document.getElementById("order-number");
  const orderNo = localStorage.getItem('tokomi_order_number');
  if (orderEl && orderNo) orderEl.textContent = orderNo.toUpperCase();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // --- helpers ---
  const addDays = (date, n) => {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  };
  const fmt = (d) => {
    const jours = ["DIMANCHE","LUNDI","MARDI","MERCREDI","JEUDI","VENDREDI","SAMEDI"];
    const mois  = ["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
    return `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]}`;
  };

  // --- base date (checkout) ---
  const iso = localStorage.getItem("tokomi_checkout_date_iso");
  const base = iso ? new Date(iso) : new Date(); // fallback aujourd'hui si absent

  // --- lire le mode d’expédition choisi ---
  // ex possibles: "STANDARD 7-10 JOURS – €9,90" | "EXPRESS 3-5 JOURS – €14,90" | "EN 1 JOUR – €24,90"
  const rawOpt = localStorage.getItem("selectedShipping")
             || localStorage.getItem("tokomi_shipping_option")
             || "";

  const opt = rawOpt.toLowerCase();

  // --- déterminer la fenêtre ---
  let minDays = 0, maxDays = 0;
  if (opt.includes("standard")) {           // STANDARD 7-10 JOURS
    minDays = 7; maxDays = 10;
  } else if (opt.includes("express")) {     // EXPRESS 3-5 JOURS
    minDays = 3; maxDays = 5;
  } else if (opt.includes("1 jour") || opt.includes("en 1 jour")) { // EN 1 JOUR
    minDays = 1; maxDays = 1;
  } else {
    // mode inconnu → on garde une info générique
    const el = document.getElementById("estimated-date");
    if (el) el.textContent = "À CONFIRMER";
    return;
  }

  // --- calcul et rendu ---
  const dMin = addDays(base, minDays);
  const dMax = addDays(base, maxDays);

  const el = document.getElementById("estimated-date");
  if (!el) return;

  if (minDays === maxDays) {
    // 1 jour
    el.textContent = fmt(dMin);
  } else {
    // fenêtre (ex: ENTRE LUNDI 12 AOÛT ET JEUDI 15 AOÛT)
    el.textContent = `ENTRE ${fmt(dMin)} ET ${fmt(dMax)}`;
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  // Prend d'abord l'adresse "summary", sinon l'adresse simple, sinon fallback
  const raw =
    localStorage.getItem("tokomi_summary_address") ||
    localStorage.getItem("tokomi_address") ||
    "";

  const el = document.getElementById("confirmation-address");
  if (!el) return;

  // Affiche joliment les retours à la ligne
  el.innerHTML = raw
    ? raw.replace(/\n/g, "<br>")
    : "Adresse non disponible";
});
</script>



</body>
</html>
