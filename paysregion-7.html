  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pays – Tokomi</title>
  <style>
html, body {
  height: auto !important;
  min-height: 100%;
  overflow-y: auto !important;
  margin: 0;
  padding: 0;
  font-family: 'Space Grotesk', sans-serif;
  background-color: #fff;
  box-sizing: border-box;
}
*, *::before, *::after {
  box-sizing: inherit;
}
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    .btn-retour {
      position: absolute;
      left: 10px;
      top: 54px;
      background: none;
      border: none;
      font-size: 11px;
      color: black;
      font-weight: 300;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    .title {
      text-align: center;
      margin-top: 100px;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .search-container {
  margin-top: 28px !important;
  padding: 10px !important;
  outline: none;
  border-bottom: 1px solid white !important;
  height: 64px; 
  transition: none !important;
}

    .search-bar {
width: 90%;
  height: 48px;
  padding: 0 16px;
  font-size: 12px;
  font-weight: 300;
  text-transform: uppercase;
  border: none;
  border-bottom: none;  /* ✅ maintenant blanche (invisible) */
  border-radius: 0;
  outline: none;
  background-color: white;
  text-align: center;
  display: block;
  margin: 0 auto;  
  transition: none !important;
  box-sizing: border-box;
}

.container {

  height: auto !important;
  max-height: none !important;
  overflow: visible !important;
      margin-top: -2px;
      padding: 20px 24px 120px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    margin-bottom: 22px;
    }

    .country-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
    }

    .left-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    .country-label {
      font-size: 12px;
      font-weight: 300;
      color: #333;
      text-transform: capitalize;
    }

    input[type="radio"] {
      display: none;
    }

    .custom-radio {
      width: 12px;
      height: 12px;
      border: 1px solid #333;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
    }

    .custom-radio::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s ease;
    }

    input[type="radio"]:checked + .custom-radio::after {
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

  <script>
    function selectCountry(id) {
      document.getElementById(id).checked = true;
    }
    document.getElementById("searchInput").addEventListener("input", function () {
    const query = this.value.toLowerCase();
    document.querySelectorAll(".country-option").forEach(option => {
      const text = option.innerText.toLowerCase();
      option.style.display = text.includes(query) ? "flex" : "none";
    });
  });
</script>
