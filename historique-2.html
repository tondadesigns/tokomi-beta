<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Historique des commandes – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-transform: uppercase;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      margin-top: 82px;
}
      .page-title {
  font-size: 28px;  /* taille augmentée */
  font-weight: 600;
  margin: 0;
  margin-top: 120px;
  text-align: center;
}

.btn-retour {
  position: absolute;
  left: 28px;
  top: 124px;
  color: black;
  background: none;
  border: none;
  font-size: 26px;
  font-weight: 300;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
}
    .order-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .order-card {
      border: 1px solid black;
      border-radius: 0;
      padding: 8px 16px;
      margin-left: 20px;
      margin-right: 20px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      font-size: 26px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .order-status {
      text-align: right;
      font-size: 18px;
      font-weight: 300;
      color: #888;
      margin-bottom: 8px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .order-products {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
    }

    .order-list .order-card {
  padding: 32px;          /* + espace interne */
  min-height: 300px;      /* carte visuellement plus grande */
}

    
    .product-thumb {
      width: 140px;
      flex: 0 0 auto;
    }

    .product-thumb img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .product-info {
      font-size: 16px;
      margin-top: 4px;
    }

    .product-info .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      color: #000;
    }

    .product-info .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      color: #555;
    }

    .product-info .price {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      color: #000;
    }

    .no-orders {
      text-align: left;
      text-transform: none !important;
      padding: 48px 16px;
      font-size: 27px;
      font-weight: 300;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
  <button class="btn-retour" onclick="location.href='profil.html'">RETOUR</button>
    <h1 class="page-title">Historique des commandes</h1>
  </header>

  <div class="order-list"></div>
 
<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.querySelector('.order-list');
  const orders = JSON.parse(localStorage.getItem('tokomi_orders')) || [];
  container.innerHTML = '';

  // === Enhancer non-invasif : calcule et persiste le cumul ===
(function persistCumulativeTotalFromOrders() {
  try {
    const total = (orders || []).reduce((acc, o) => {
      // ignore « annulé / remboursé »
      const st = String(o?.status || '').toLowerCase();
      if (/annul|cancel|rembours|refund/.test(st)) return acc;

      // total de la commande : on respecte o.total, sinon on calcule via produits
      const t = (typeof o?.total !== 'undefined')
        ? parseMoney(o.total)
        : sumItems(o?.products);

      return acc + (Number.isFinite(t) ? t : 0);
    }, 0);

    const rounded = Math.round(total);

    // Mises à jour compatibles avec membership.html (ne casse rien du rendu)
    localStorage.setItem('tokomi_total_spend', String(rounded));

    let loyalty = {};
    try { loyalty = JSON.parse(localStorage.getItem('tokomiLoyalty') || '{}') || {}; } catch(e) {}
    loyalty.loyaltyTotal = rounded;
    localStorage.setItem('tokomiLoyalty', JSON.stringify(loyalty));
  } catch(e) {
    // silencieux pour ne pas casser le flux
  }

  // Helpers locaux pour éviter toute collision de noms
  function sumItems(items) {
    if (!Array.isArray(items)) return 0;
    let t = 0;
    for (const it of items) {
      const qty  = Number(it?.qty ?? it?.quantity ?? 1);
      const unit = parseMoney(it?.price ?? it?.amount ?? it?.total ?? 0);
      t += qty * unit;
    }
    return t;
  }

  function parseMoney(val) {
    if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
    if (val == null) return 0;
    let s = String(val).trim();

    // enlève symboles et espaces
    s = s.replace(/[€$£¥]|[A-Z]{2,}/gi, '').replace(/\s/g, '');

    // normalise formats EU/US
    if (s.includes(',') && s.includes('.')) {
      s = s.replace(/\./g, '').replace(',', '.'); // 1.234,56 -> 1234.56
    } else if (s.includes(',') && !s.includes('.')) {
      s = s.replace(',', '.');                    // 1234,56  -> 1234.56
    } else {
      s = s.replace(/,/g, '');                    // 1,234.56 -> 1234.56
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }
})();

  
  if (!orders.length) {
    const empty = document.createElement('div');
    empty.className = 'no-orders';
    empty.textContent = 'Aucune commande pour le moment.';
    container.appendChild(empty);
    return;
  }

  orders.forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card';

    const header = document.createElement('div');
    header.className = 'order-header';
    header.innerHTML = `
      <div>Commande #${order.number || order.id || '—'}</div>
      <div>${formatDate(order.date)}</div>
    `;

    const status = document.createElement('div');
    status.className = 'order-status';
    status.textContent = `Statut : ${order.status || '—'}`;

    const products = document.createElement('div');
    products.className = 'order-products';

    (order.products || []).forEach(p => {
      const thumb = document.createElement('div');
      thumb.className = 'product-thumb';
      thumb.innerHTML = `
        <img src="${p.image || 'https://via.placeholder.com/150x200'}" alt="${escapeHtml(p.name || 'Produit')}">
        <div class="product-info">
          <div class="brand">${p.brand || ''}</div>
          <div class="name">${p.name || ''}</div>
          <div class="price">€${Number(p.price || 0).toFixed(0)}</div>
        </div>
      `;
      products.appendChild(thumb);
    });

    card.appendChild(header);
    card.appendChild(status);
    card.appendChild(products);
    container.appendChild(card);
  });

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
  }
  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }
});
</script>

</body>
</html>
