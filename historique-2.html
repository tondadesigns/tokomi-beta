<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Historique des commandes – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-transform: uppercase;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 600;
      margin-top: 82px;
    }
.btn-retour {
  position: absolute;
  left: 28px;
  top: 124px;
  color: black;
  background: none;
  border: none;
  font-size: 26px;
  font-weight: 300;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
}
    .order-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .order-card {
      border: 1px solid #eee;
      border-radius: 0;
      padding: 16px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .order-status {
      text-align: right;
      font-size: 10px;
      font-weight: 400;
      color: #888;
      margin-bottom: 8px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .order-products {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
    }

    .product-thumb {
      width: 120px;
      flex: 0 0 auto;
    }

    .product-thumb img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .product-info {
      font-size: 10px;
      margin-top: 4px;
    }

    .product-info .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      color: #000;
    }

    .product-info .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      color: #555;
    }

    .product-info .price {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      color: #000;
    }

    .no-orders {
      text-align: center;
      padding: 48px 16px;
      font-size: 12px;
      font-weight: 300;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
  <button class="btn-retour" onclick="location.href='profil.html'">RETOUR</button>
    Historique des commandes</header>

  <div class="order-list">
    <!-- Exemple de commande -->
    <div class="order-card">
      <div class="order-header">
        <div>Commande #10234</div>
        <div>15 juillet 2025</div>
      </div>
      <div class="order-status">Statut : Livrée</div>
      <div class="order-products">
        <div class="product-thumb">
          <img src="https://via.placeholder.com/150x200" alt="Produit 1">
          <div class="product-info">
            <div class="brand">Marque 1</div>
            <div class="name">Nom produit 1</div>
            <div class="price">€200</div>
          </div>
        </div>
        <div class="product-thumb">
          <img src="https://via.placeholder.com/150x200" alt="Produit 2">
          <div class="product-info">
            <div class="brand">Marque 2</div>
            <div class="name">Nom produit 2</div>
            <div class="price">€180</div>
          </div>
        </div>
        <div class="product-thumb">
          <img src="https://via.placeholder.com/150x200" alt="Produit 2">
          <div class="product-info">
            <div class="brand">Marque 2</div>
            <div class="name">Nom produit 2</div>
            <div class="price">€180</div>
          </div>
        </div>
        <div class="product-thumb">
          <img src="https://via.placeholder.com/150x200" alt="Produit 2">
          <div class="product-info">
            <div class="brand">Marque 2</div>
            <div class="name">Nom produit 2</div>
            <div class="price">€180</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Exemple vide -->
    <!-- <div class="no-orders">Aucune commande pour le moment.</div> -->
  </div>

</body>
</html>
