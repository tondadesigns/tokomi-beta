<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-i18n-title="auth.forgotTitle">Mot de passe oublié – Tokomi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #fff;
      color: #111;
      height: 100svh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .btn-retour {
      left: 32px;
      top: 104px;
      position: fixed;
  left: calc(env(safe-area-inset-left) + 32px);
      z-index: 1000;
      background: none;
      border: none;
      font-size: 28px;
      font-weight: 300;
      color: black;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    .forgot-container {
      width: 100%;
      max-width: 360px;
      padding: 32px;
      text-align: center;
      transform: translateY(-6vh);
    }

    h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    p {
      font-size: 28px;
      margin-bottom: 24px;
      font-weight: 300;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 10px;
      font-size: 26px;
      font-weight: 300;
      border: none; 
      border-bottom: 1px solid #ccc;
      border-radius: 0;
      font-family: 'Space Grotesk', sans-serif;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    input[type="email"]:focus {
  outline: none;
  border-color: none; /* optionnel : couleur personnalisée */
}

    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: black;
      color: white;
      border: none;
      font-size: 28px;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 300;
      transform: translateX(12px);

    }

    .submit-btn:hover {
      background-color: #222;
    }
  </style>
  <!-- i18n -->
  <script defer src="i18n/translations.js"></script>
  <script defer src="i18n/i18n.js"></script>
  <script defer src="i18n/tokomi-i18n-compat.js"></script>
</head>
<body>
  
  <button class="btn-retour" onclick="location.href='connexion.html'" data-i18n="common.back" >RETOUR</button>

  <div class="forgot-container">
    <h2 data-i18n="auth.forgotTitle">Réinitialiser votre mot de passe</h2>
    <p data-i18n="auth.forgotInstruction">Entrez votre adresse email.</p>
    <input type="email" id="email" data-i18n-placeholder="auth.userPlaceholder" placeholder="Votre adresse email" />
    <button class="submit-btn" onclick="submitEmail()" data-i18n="auth.sendCta" >Envoyer</button>
  </div>

  <script>
    function goBack() {
      window.history.back();
    }

    function submitEmail() {
      const email = document.getElementById('email').value;
      if (!email) {
        alert("Veuillez entrer votre email.");
        return;
      }
      alert("Si cette adresse existe, un lien de réinitialisation a été envoyé.");
      window.location.href = "connexion.html";
    }
  </script>

</body>
</html>
