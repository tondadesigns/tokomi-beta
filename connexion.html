<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-i18n-title="auth.loginTitle">Connexion – Tokomi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #fff;
      color: #111;
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
      
    .btn-retour {
      position: absolute;
      left: 44px;
      top: 104px;
      background: none;
      border: none;
      font-size: 28px;
      font-weight: 300;
      color: black;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .login-container {
      transform: translateY(-6vh);
      transition: transform .25s ease; 
      width: 100%;
      max-width: 360px;
      padding: 32px;
      text-align: center;
    }
    @media (max-width: 600px) {
      .login-container { transform: translateY(-4vh); }
    }

    h2 {
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 42px;
      text-transform: uppercase;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 26px;
      color: grey;
      margin-bottom: 4px;
      font-weight: 300;
      text-transform: uppercase;
    }

    .form-group input {
      padding: 1px;
      font-size: 26px;
      font-weight: 300;
      border: none;
      border-bottom: 1px solid #ccc;
      border-radius: 0;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .submit-btn {
      margin-top: 24px;
      padding: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 200;
      text-transform: uppercase;
      background-color: black;
      color: white;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #333;
    }

    .extra-links {
      margin-top: 28px;
      font-size: 26px;
    }

    .extra-links a {
      color: grey;
      text-decoration: none;
      font-weight: 300;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- i18n -->
  <script defer src="i18n/translations.js"></script>
  <script defer src="i18n/i18n.js"></script>
  <script defer src="i18n/tokomi-i18n-compat.js"></script>
</head>
<body>
  <button class="btn-retour" onclick="location.href='intro-utilisateur.html'" data-i18n="common.back">RETOUR</button>

  <div class="login-container">
    <h2 data-i18n="auth.loginTitle">Connexion</h2>

    <div class="form-group">
      <label for="email" data-i18n="auth.userPlaceholder">Adresse e-mail</label>
      <input type="email" id="email" data-i18n-placeholder="auth.userPlaceholder" placeholder="Adresse e-mail">
    </div>

    <div class="form-group">
      <label for="password" data-i18n="auth.passPlaceholder">Mot de passe</label>
      <input type="password" id="password" data-i18n-placeholder="auth.passPlaceholder" placeholder="Mot de passe">
    </div>

    <button class="submit-btn" onclick="login()" data-i18n="auth.loginCta">Se connecter</button>

    <div class="extra-links">
      <a href="motdepasseoublie.html" data-i18n="auth.forgot">Mot de passe oublié ?</a>
    </div>
  </div>

  <script>
    // ---- i18n helper (fallback) ----
    function currentLang(){ return localStorage.getItem('selectedLang') || 'fr'; }
    function getDeep(obj, path){ return path.split('.').reduce((o,k)=> (o && o[k] !== undefined ? o[k] : undefined), obj); }
    function applyTranslationsLite(lang){
      const dict = (window.I18N || {})[lang] || {};
      // text nodes
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        const val = getDeep(dict, key);
        if (val !== undefined) el.textContent = val;
      });
      // placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
        const key = el.getAttribute('data-i18n-placeholder');
        const val = getDeep(dict, key);
        if (val !== undefined) el.setAttribute('placeholder', val);
      });
      // title
      const titleEl = document.querySelector('title[data-i18n-title]');
      if (titleEl){
        const key = titleEl.getAttribute('data-i18n-title');
        const val = getDeep(dict, key);
        if (val) document.title = val;
      }
      // html lang
      if (dict.htmlLang) document.documentElement.lang = dict.htmlLang;
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      const lang = currentLang();
      (window.applyTranslations || applyTranslationsLite)(lang);
    });
  </script>

  <script>
    function login() {
      const emailEl = document.getElementById('email');
      const pwdEl   = document.getElementById('password');
      const email    = (emailEl?.value || "").trim();
      const password = (pwdEl?.value || "");

      if (!email || !password) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      const raw = localStorage.getItem('signupData');
      if (!raw) {
        alert("Aucun compte enregistré. Créez un compte d’abord.");
        window.location.href = 'signup.html';
        return;
      }

      let data;
      try { data = JSON.parse(raw); } catch (e) {
        alert("Données de compte invalides. Veuillez recréer votre compte.");
        localStorage.removeItem('signupData');
        window.location.href = 'signup.html';
        return;
      }

      const okEmail = (data.email || "").trim().toLowerCase() === email.toLowerCase();
      const okPwd   = (data.password || "") === password;

      if (!okEmail || !okPwd) {
        alert("Identifiants incorrects.");
        return;
      }

      // Auth OK
      localStorage.setItem('tokomi_auth', 'user');
      localStorage.setItem('tokomi_username', (data.prenom || "").trim());
      window.location.href = 'profil.html';
    }
  </script>
</body>
</html>
