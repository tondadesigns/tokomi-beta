<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion – Tokomi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #fff;
      color: #111;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
      
    .btn-retour {
      position: absolute;
      left: 38px;
      top: 104px;
      background: none;
      border: none;
      font-size: 28px;
      font-weight: 300;
      color: black;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 360px;
      padding: 32px;
      text-align: center;
    }

    h2 {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 24px;
      color: grey;
      margin-bottom: 4px;
      font-weight: 300;
      text-transform: uppercase;
    }

    .form-group input {
      padding: 14px;
      font-size: 26px;
      border: none;
      border-bottom:  1px solid #ccc;
      border-radius: 0;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .submit-btn {
      margin-top: 24px;
      padding: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 200;
      text-transform: uppercase;
      background-color: black;
      color: white;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #333;
    }

    .extra-links {
      margin-top: 28px;
      font-size: 22px;
      
    }

    .extra-links a {
      color: black;
      text-decoration: none;
      font-weight: 400;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <button class="btn-retour" onclick="location.href='intro-utilisateur.html'">RETOUR</button>
  <div class="login-container">
    <h2>Connexion</h2>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="">
    </div>
    <button class="submit-btn" onclick="login()">Se connecter</button>
    <div class="extra-links">
  
      <a href="#">Mot de passe oublié ?</a>
    </div>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      // Simulation d'une connexion réussie
      alert("Connexion réussie. Bienvenue !");
      window.location.href = "accueil.html";
    }
  </script>

</body>
</html>
