<!DOCTYPE html>

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      text-transform: uppercase;
    }

    header {
      margin-top: 55px;
      text-align: center;
      padding: 24px 0;
      font-size: 40px !important;
      font-family: 'Space Grotesk', sans-serif;
    }

    .username {
  text-align: center;

  font-weight: 500;
  margin-top: -12px; /* réduit l’espace entre les deux */
  font-family: 'Space Grotesk', sans-serif;
}
    
    .btn {
      display: block;
      width: calc(100% - 48px);
      margin-top: 57px;
      margin-bottom: -14px;
      margin-left: 4px;
      padding: 12px;
      font-size: 12px;
      font-weight: 300;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      border: none;
      background: none;
      cursor: pointer;
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding: 16px;
    }

    .carousel-item {
      min-width: 160px;
      flex: 0 0 auto;
      text-align: left;
    }

    .carousel-item img {
      width: 200px;
      height: 500px; /* ou plus si tu veux encore plus long */
  object-fit: cover;
      border: 1px solid #ddd;
    }

    .carousel-item .brand,
    .carousel-item .product,
    .carousel-item .price {

      margin-top: 4px;
    }

    .carousel-item .product {
      font-weight: 300;
      font-size: 26px;
    }

    .carousel-item  .brand {
      font-size:28px;
      font-weight: 600;
    }

    .carousel-item .price {
      font-size: 28px;
      margin-bottom: -16px;
      }

    .section {
      padding: 16px;
      font-size: 48px;
      font-weight: 500;
      color: #000;
    }

    .section h3 {
      font-size: 28px;
      
      font-weight: 600;
      margin-bottom: 8px;
    }

    .section .btn {
      border: none;
      text-align: left;
      font-size: 22px !important;
      padding-left: 0;
      margin: 0 0 8px 0;
      background: none;
      color: #000;
    }
  /* FOOTER  */
.sticky-footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background-color: white;
  display: flex;
  height: 40px;
  justify-content: space-around;
  padding: 18px 0;
  border-top: 1px solid #ccc;
  z-index: 1000;
}
.menu-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 23px;
  margin-top: 3px;
  font-family: 'Space Grotesk', sans-serif;
  color: #666;
  text-decoration: none;
  transition: color 0.2 ease;
}

.menu-item:hover,
.menu-item.active {
  color: #000;
  font-weight: 600;
}

.btn-signup {
  font-size: 22px;
  color: black;
  margin-top: 2px !important;
  margin-bottom: 40px !important;
  margin-left: -1px;
}
    
  </style>
</head>
<body>

  <header>
    BIENVENUE 
  </header>
  <div style="text-align: center; font-size: 62px !important; font-weight: 500;  margin-bottom: -20px;font-family: 'Space Grotesk', sans-serif;"></div>
  <div class="username" style="margin-bottom: 250px;" ></div>
  </div>

  <div class="section">
    <h3>MON COMPTE</h3>
    <button class="btn" style="margin-top: -8px; font-size: 22px;" onclick="window.location.href='panier-favoris.html'">Panier</button>
    <button class="btn" style="margin-top: -18px; font-size: 22px;" onclick="window.location.href='favoris.html'">Favoris</button>
    <button class="btn" style="margin-top: -20px; font-size: 22px;" onclick="window.location.href='listes.html'">Listes</button>
    <button class="btn" style="margin-top: -18px; font-size: 22px;" onclick="window.location.href='informationspersonnelles.html'">Informations personnelles</button>
    <button class="btn" style="margin-top: -21px;" onclick="window.location.href='historique-2.html'">Historique des commandes</button>
    <button class="btn" style="margin-top: -18px; margin-bottom: -34px;" onclick="window.location.href='membership.html'">Programme de membre</button>
  </div>

  <div class="section">
    <h3>MES RÉGLAGES</h3>
    <button class="btn" style="margin-top: -8px;" onclick="window.location.href='preferencesnav.html'">Préférences de navigation</button>
    <button class="btn" style="margin-top: -19px;" onclick="window.location.href='notification.html'">Notifications</button>
    <button class="btn" style="margin-top: -20px;" onclick="window.location.href='langue.html'"  >Langue</button>
    <button class="btn" style="margin-top: -18px; margin-bottom: -34px;" onclick="window.location.href='paysregion-7.html'">Pays / Région</button>
  </div>

  <div class="section">
    <h3>ASSISTANCE</h3>
    <button class="btn" style="margin-top: -8px; margin-bottom: -10px;" onclick="window.location.href='contactez-nous.html'">CONTACTEZ-NOUS</button>
    <button class="btn" style="margin-top: -8px;" onclick="window.location.href='frasqu.html'">FAQ</button>
    <button class="btn" style="margin-top: -18px;margin-bottom: 32px;" onclick="window.location.href='politique-confidentialite.html'">POLITIQUE DE CONFIDENTIALITÉ</button>
    <button class="btn" style="margin-top: -40px;margin-bottom: 32px;" onclick="window.location.href='conditions-generales.html'">CONDITIONS GÉNÉRALES</button>
  <button id="authBtn" class="btn" style="margin-top: 6px;margin-bottom: 8px !important; margin-left: -1px;">Déconnexion</button>
  </div>

  <div id="signupContainer"></div>
  

<footer class="sticky-footer">
    <a href="accueil.html" class="menu-item ">
      
      <span>ACCUEIL</span>
    </a>

    <a href="explorer.html" class="menu-item"> 
      
      <span>EXPLORER</span>
    </a>
    
    
    <a href="profil.html"class="menu-item active">
      
      <span>PROFIL</span>
    </a>
  </footer>


  <script>
    document.addEventListener('DOMContentLoaded', () => {
  const auth = localStorage.getItem('tokomi_auth');

  if (auth === 'guest') {
    // vider le nom
    const usernameDiv = document.querySelector('.username');
    if (usernameDiv) usernameDiv.textContent = '';

    // transformer le bouton Déconnexion -> Se connecter
    // (idéal: donne un id à ce bouton, ex. id="authBtn")
    const authBtn = document.getElementById('authBtn') || document.querySelector('.btn');
    if (authBtn) {
      authBtn.textContent = 'Se connecter';
      authBtn.onclick = () => {
        localStorage.removeItem('tokomi_auth'); // on sort du mode invité
        window.location.href = 'connexion.html';
      };
    
    // 3) Ajouter le bouton "Créer un compte"
      const signupBtn = document.createElement('button');
      signupBtn.textContent = 'Créer un compte';
      signupBtn.onclick = redirectToSignUp;
      signupBtn.style.marginTop = '2px';
      signupBtn.style.marginBottom = '40px';
      signupBtn.style.marginLeft = '-1px';
      signupBtn.className = 'btn btn-signup';
      
      authBtn.insertAdjacentElement('afterend', signupBtn);
    }
  }
});
    function redirectToSignUp() {
  window.location.href = 'signup.html'; // adapte si ta page s’appelle autrement
}
  </script>

</body>
</html>
