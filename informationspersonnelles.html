<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Informations personnelles – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-size: 26px !important;
      text-transform: uppercase;
    }
body, body * {
  font-size: 26px !important;
  font-family: 'Space Grotesk', sans-serif !important;
  text-transform: uppercase;
}

    .btn-retour {
  margin-left: 30px;
  margin-top: 132px;
  background: none;
  border: none;
  color: black;
  font-size: 28px;
  font-weight: 300;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: relative;
    }
    
    #menuToggle { 
      position: absolute;
      right: 42px;   /* toujours aligné à droite */
      top: -28px; 
      background: none;
      border: none;
      font-size: 20px;
      font-weight: 300;
      cursor: pointer;
      margin-left: auto;
    }
    .page-title {
  top: 124px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px !important;
  font-weight: 600;
  margin: 0;
  margin-bottom: 52px;
}
    
    #menuToggle.selection-active {
  font-size: 12px; /* pour "TOUT SÉLECTIONNER" */
  font-weight: 300; /* si tu veux aussi en gras */
}

h1 {
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    
    .menu-icon {
      font-size: 12px;
      cursor: pointer;
    }

    
    #menu {
      justify-content: right;
    }
     .context-menu {
  position: absolute;
  top: 2px;
  right: 40px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  font-size: 10px;
  display: none;
  cursor: pointer;
  z-index: 10;
}

.context-menu div {
  padding: 14px 20px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 300;
  transition: background 0.2s ease;
}
    .section {
      margin-left: 34px;
      margin-top: 240px;
    }

    .info-block {
      margin-bottom: 24px;
    }

    .info-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: black;
    }

    .info-value {
      font-size: 12px;
      font-weight: 300;
    }

    .masked {
      letter-spacing: 3px;
    }

    /* --- Agrandir le titre de la page --- */
h1.page-title {
  font-size: 30px !important;   /* was 40px */
  line-height: 1.1;
}

/* --- Agrandir les libellés --- */
.section .info-title {
  font-size: 22px !important;   /* was 12px */
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* --- Agrandir les valeurs --- */
.section .info-value {
  font-size: 22px !important;   /* was 12px */
  font-weight: 300;              /* un peu plus lisible */
  line-height: 1.35;
}

  </style>
</head>
<body>
<button class="btn-retour" onclick="location.href='profil.html'">RETOUR</button>
  <header>
  <h1 class="page-title">INFORMATIONS PERSONNELLES</h1>
    <span id="menuToggle" class="menu-icon" onclick="toggleContextMenu(event)">PLUS</span>
    
    <div class="context-menu" id="menu" style="display: none;" >
      <div onclick="enterSelectionMode()">MODIFIER</div>
      <div onclick="exitSelectionMode()">ANNULER</div>
    </div>
   


  </header>

  <div class="section">
    <div class="info-block" data-key="fullname">
      <div class="info-title">Prénom Nom</div>
      <div class="info-value" id="user-fullname" contenteditable="false">Kevin Djamboleka</div>
    </div>
    <div class="info-block">
      <div class="info-title">Adresse postale</div>
      <div class="info-value" id="user-address">9 Avenue Flamboyant, Gombe Kinshasa, RDC</div>
    </div>
    <div class="info-block">
      <div class="info-title">Adresse email</div>
      <div class="info-value" id="user-email">kevin.djamboleka@gmail.com</div>
    </div>
    <div class="info-block">
      <div class="info-title">Téléphone</div>
      <div class="info-value" id="user-phone">+243 85 63 68 560</div>
    </div>
    <div class="info-block">
      <div class="info-title">Mot de passe</div>
      <div class="info-value masked" id="user-password" contenteditable="false">****</div>
    </div>
  </div>

<!-- Bouton ENREGISTRER -->
  <div id="saveContainer" style=" display:none; text-align:center; margin: 40px 0;">
    <button id="saveBtn" style="
      padding: 20px 36px;
      font-size: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
      border-radius: 0px;
    ">
      ENREGISTRER
    </button>
  </div>

  <script>
  
  
 

  function toggleContextMenu(event) {
    event.stopPropagation();
    const menu = document.getElementById("menu");
    if (!menu) return;
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  }

  // Fermer le menu si on clique ailleurs
  window.addEventListener("click", () => { 
    const menu = document.getElementById("menu");
    if (menu) menu.style.display = "none";
  });

  document.getElementById("menu")?.addEventListener("click", e => e.stopPropagation());

  const userData = JSON.parse(localStorage.getItem("signupData")) || {};
  const elFullname = document.getElementById("user-fullname");
  const full = [userData.prenom, userData.nom].filter(Boolean).join(" ").trim();
 
  if (elFullname) elFullname.textContent = full || "x x";

  const elAddr = document.getElementById("user-address");
  if (elAddr) elAddr.textContent = (userData.adresse || "x x");

  const elEmail = document.getElementById("user-email");
  if (elEmail) elEmail.textContent = (userData.email || "x x");

  const elPhone = document.getElementById("user-phone");
  if (elPhone) elPhone.textContent = (userData.telephone || "x x");
    
  function enterSelectionMode() {
    const saveContainer = document.getElementById("saveContainer");
    const blocks = document.querySelectorAll(".info-block .info-value");
    blocks.forEach(block => {
      block.setAttribute("contenteditable", "true");
      block.style.display = "inline-block";
      block.style.width = "95%"; // par exemple
      block.style.border = "none";
      block.style.borderBottom = "1px solid #aaa";
      block.style.padding = "6px";
      block.style.fontFamily = "'Space Grotesk', sans-serif";
      block.style.fontSize = "24px";
      block.style.fontWeight = "300";
    });
   if (saveContainer) saveContainer.style.display = "block";
  }
  
  function exitSelectionMode() {
    const saveContainer = document.getElementById("saveContainer");
    const blocks = document.querySelectorAll(".info-block .info-value");
    blocks.forEach(block => {
      block.setAttribute("contenteditable", "false");
      block.style.borderBottom = "none";
      block.style.padding = "0";
      block.style.fontFamily = "";
      block.style.fontSize = "";
      block.style.fontWeight = "";
    });
    if (saveContainer) saveContainer.style.display = "none";
    const menu = document.getElementById("menu");
    if (menu) menu.style.display = "none";
  }

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.addEventListener("click", () => {
    const fullname = (elFullname ? elFullname.textContent : "").trim();
    const [prenom = "", nom = ""] = fullname.split(/\s+/, 2);
    const pwdEl = document.getElementById("user-password");
    const existing = JSON.parse(localStorage.getItem("signupData") || "{}");

    // Ne pas écraser par "****" ou vide
    let newPassword = existing.password || "";
    if (pwdEl) {
      const raw = (pwdEl.textContent || "").trim();
      if (raw && raw !== "****") newPassword = raw;
    }
    const updatedData = {
      prenom,
      nom,
      adresse: (elAddr ? elAddr.textContent : "").trim(),
      email: (elEmail ? elEmail.textContent : "").trim(),
      telephone: (elPhone ? elPhone.textContent : "").trim(),
      password: newPassword
    };

    // Sauvegarde dans localStorage
    localStorage.setItem("signupData", JSON.stringify(updatedData));
    localStorage.setItem("tokomi_username", updatedData.prenom || "");

    alert("✅ Informations enregistrées avec succès !");
    exitSelectionMode();
  });
    
  window.enterSelectionMode = enterSelectionMode;
  window.exitSelectionMode  = exitSelectionMode;
</script>



</body>
</html>
