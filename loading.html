
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title> Loading Tokomi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-container {
      animation: backgroundChange 3s forwards ease-in-out;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-letter {
      color: white;
      font-size: 4px;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      opacity: 0.8;
      animation: zoomIn 3s forwards ease-in-out, colorChange 3s forwards ease-in-out;
    }

    @keyframes zoomIn {
      0% {
        font-size: 4px;
        opacity: 0.4;
        transform: scale(1);
      }
      50% {
        opacity: 1;
      }
      100% {
        font-size: 120px;
        transform: scale(1.5);
      }
    }

    @keyframes backgroundChange {
      0% {
        background: black;
      }
      100% {
        background: white;
      }
    }

    @keyframes colorChange {
      0% {
        color: white;
      }
      100% {
        color: black;
      }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="logo-letter">T</div>
  </div>

 
  <script>
  // Redirection après 4 secondes (ajuste si nécessaire)
  setTimeout(function () {
    const success = Math.random() > 0.3;
      if (success) {
        window.location.href = "confirmation.html";
      } else {
        window.location.href = "echec.html";
      }
    }, 4000);
  
}
</script>

</body>
</html>
