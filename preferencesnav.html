<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Préférences de navigation – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    .btn-retour {
      position: absolute;
      left: 10px;
      top: 54px;
      background: none;
      border: none;
      color: black;
      font-size: 11px;
      font-weight: 300;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    .title {
  text-align: center;
  margin-top: 120px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
}


    .container {
      margin-top: -38px;
      padding: 120px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .catalogue-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
    }

    .catalogue-label {
      font-size: 11px;
      font-weight: 300;
      color: #333;
      text-transform: uppercase;
    }

    .custom-radio {
      width: 12px;
      height: 12px;
      border: 1px solid #333;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
    }

    .custom-radio::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s ease;
    }

    input[type="radio"] {
      display: none;
    }

    input[type="radio"]:checked + .custom-radio::after {
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <button class="btn-retour" onclick="location.href='profil.html'">RETOUR</button>

  <div class="title">Préférences de navigation</div>

  <div class="container">
    <label class="catalogue-option">
      <span class="catalogue-label">Catalogue masculin</span>
      <input type="radio" name="catalogue" id="masculin">
      <span class="custom-radio" onclick="selectRadio('masculin')"></span>
    </label>

    <label class="catalogue-option">
      <span class="catalogue-label">Catalogue féminin</span>
      <input type="radio" name="catalogue" id="feminin">
      <span class="custom-radio" onclick="selectRadio('feminin')"></span>
    </label>
  </div>

  <script>
  const GENDER_KEY = 'tokomi_explore_gender';
  const MAP = { masculin: 'men', feminin: 'women' };

  // Clic sur le rond custom
  function selectRadio(id) {
    const input = document.getElementById(id);
    input.checked = true;

    // Sauvegarde la préférence normalisée
    const normalized = MAP[id] || 'all';
    localStorage.setItem(GENDER_KEY, normalized);
  }

  // Accessibilité: si l'utilisateur active le vrai input (clavier),
  // on enregistre aussi la préférence.
  document.addEventListener('DOMContentLoaded', () => {
    // Pré-sélection selon la préférence enregistrée
    const pref = localStorage.getItem(GENDER_KEY); // 'men' | 'women' | null
    if (pref === 'men')   document.getElementById('masculin').checked = true;
    if (pref === 'women') document.getElementById('feminin').checked = true;

    // Écoute les changements clavier/label
    const masculin = document.getElementById('masculin');
    const feminin  = document.getElementById('feminin');

    masculin.addEventListener('change', () => {
      if (masculin.checked) localStorage.setItem(GENDER_KEY, 'men');
    });
    feminin.addEventListener('change', () => {
      if (feminin.checked) localStorage.setItem(GENDER_KEY, 'women');
    });
  });
</script>


</body>
</html>
