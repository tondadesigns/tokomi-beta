<body>

  
<div class="header">
  <button class="btn-retour" onclick="window.location.href='profil.html'">RETOUR</button>

</div>

  <script>
  
    const LS_KEY = 'tokomiLists';

function getLists() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { return []; }
}

// Quand on clique sur une liste
function openListDetail(listId) {
  localStorage.setItem("tokomiSelectedListId", listId);
  window.location.href = "liste-detail.html";
}

// Afficher les listes
function renderLists() {
  const container = document.getElementById("listContainer");
  const lists = getLists();
  container.innerHTML = '';

  lists.forEach(list => {
    const count = Array.isArray(list.items) ? list.items.length : 0;

    const wrapper = document.createElement('div');
    wrapper.className = 'list-wrapper';
    wrapper.dataset.id = list.id; // ✅ on garde l'id pour rename/delete

    const card = document.createElement('a');
    card.className = 'list-card';
    card.href = `liste-detail.html?id=${encodeURIComponent(list.id)}`;
    card.innerHTML = `
      <div class="list-covers-grid"></div>

      <!-- ✅ pastille de sélection (cachée par défaut) -->
      <div class="list-select-box" style="display:none">
        <label class="custom-check-wrapper">
          <input type="checkbox" class="list-checkbox" />
          <span class="custom-check"></span>
        </label>
      </div>
    `;

    const info = document.createElement('div');
    info.className = 'list-info';
    info.innerHTML = `
      <div class="list-card-title">${(list.title||'SANS NOM').toUpperCase()}</div>
      <div class="list-card-count">${count} article${count>1?'s':''}</div>
    `;

    wrapper.appendChild(card);
    wrapper.appendChild(info);
    container.appendChild(wrapper);
  });
}

// ✅ Un seul init au chargement
document.addEventListener('DOMContentLoaded', () => {
  renderLists();
  updateEmptyMessage();
  updateListCount();
});
    
function saveLists(lists) {
  localStorage.setItem(LS_KEY, JSON.stringify(lists));
}
  
    const listContainer = document.getElementById('listContainer');
    const emptyMessage = document.getElementById('emptyMessage');
    
    const listNameInput = document.getElementById('listName');

function toggleContextMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

    function openCreateListModal(ev) {
  if (ev) ev.preventDefault();
  const m = document.getElementById('createListModal');
  m.classList.add('show');
  m.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('listName')?.focus(), 0);
}

function closeCreateListModal() {
  const m = document.getElementById('createListModal');
  m.classList.remove('show');
  m.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

document.getElementById('createListModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'createListModal') closeCreateListModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCreateListModal();
});


    document.addEventListener('click', function (e) {
  const menu = document.getElementById('menu');
  const modal = document.getElementById('createListModal');
  const formWrapper = document.querySelector('.create-list-form-wrapper');

 // Clic hors menu
      if (menu && !menu.contains(e.target) && !document.getElementById('menuToggle').contains(e.target)) {
        menu.style.display = 'none';
      }
});

    function createList() {  const name = listNameInput.value.trim();
  if (!name) { listNameInput.focus(); return; }

  // 1) Lire l'état, pousser la nouvelle liste dans le schéma {id,title,items:[]}
  const lists = getLists();
  const id = Date.now().toString();
  lists.push({ id, title: name, items: [] });
  saveLists(lists);

  // 2) UI: reset + fermer la modale
  listNameInput.value = '';
  closeCreateListModal();

  // 3) Rafraîchir l’affichage et le compteur
  renderLists();
  updateListCount();
  updateEmptyMessage();

  // (Optionnel) Feedback
  alert(`Liste « ${name} » créée.`);
}
     


function toggleMenu(button) {
  const menu = button.nextElementSibling;
  document.querySelectorAll('.context-menu').forEach(m => m.style.display = 'none');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
function renameList(item) {
  const card = item.closest('.list-card');
  const titleEl = card.querySelector('.list-card-title');
  const oldTitle = titleEl.textContent;
  const newTitle = prompt("Nouveau nom de la liste :", oldTitle);
  if (!newTitle || newTitle === oldTitle) return;
  titleEl.textContent = newTitle;
  const lists = getLists();
  const a = lists.find(l => (l.title||'').toUpperCase() === oldTitle.toUpperCase());
  if (a) a.title = newTitle;
  saveLists(lists);
}

function deleteList(item) {
  if (!confirm("Supprimer cette liste ?")) return;
  const card = item.closest('.list-card');
  const title = card.querySelector('strong').textContent;
  card.remove();
  const saved = JSON.parse(localStorage.getItem('tokomiLists') || '[]');
  const updated = saved.filter(entry => entry.title !== title);
  localStorage.setItem('tokomiLists', JSON.stringify(updated));
  const albumItems = JSON.parse(localStorage.getItem('tokomiAlbumItems') || '{}');
  delete albumItems[title];
  localStorage.setItem('tokomiAlbumItems', JSON.stringify(albumItems));
  updateEmptyMessage();
  updateListCount();
}


    function updateEmptyMessage() {
      emptyMessage.style.display = listContainer.children.length === 0 ? 'block' : 'none';
    }
    // Sauvegarde dans localStorage après création
   

function updateListCount() {
  const count = document.getElementById('listContainer').children.length;
  document.getElementById('list-count').textContent = count;
}
    
function updateListSelectionUI() {
    const checkboxes = document.querySelectorAll('.list-card.selectable .list-checkbox');
  const checkedBoxes = document.querySelectorAll('.list-card.selectable .list-checkbox:checked');
  const actions = document.getElementById('selectionActions');
  const toggle = document.getElementById('menuToggle');

  actions.style.display = checkedBoxes.length > 0 ? 'flex' : 'none';

  if (toggle.classList.contains('selection-active')) {
    if (checkedBoxes.length === checkboxes.length && checkboxes.length > 0) {
      toggle.textContent = `TOUT DÉSÉLECTIONNER (${checkedBoxes.length})`;
    } else {
      toggle.textContent = `TOUT SÉLECTIONNER (${checkedBoxes.length})`;
}
}
}

function makeBackButtonCancel() {
  const backBtn = document.querySelector('.btn-retour');
  if (!backBtn) return;

  // Mémoriser l'état initial une seule fois
  if (!backBtn.dataset.originalText) {
    backBtn.dataset.originalText = backBtn.textContent || 'RETOUR';
  }
  if (!backBtn.dataset.originalOnclick) {
    backBtn.dataset.originalOnclick = backBtn.getAttribute('onclick') || "window.location.href='profil.html'";
  }

  // Devenir "ANNULER"
  backBtn.textContent = 'ANNULER';
  backBtn.removeAttribute('onclick');     // on neutralise la redirection
  backBtn.onclick = exitSelectionMode;    // clique => sortir du mode sélection
}

function restoreBackButton() {
  const backBtn = document.querySelector('.btn-retour');
  if (!backBtn) return;

  // Revenir à "RETOUR" + son onclick d'origine
  backBtn.textContent = backBtn.dataset.originalText || 'RETOUR';
  backBtn.onclick = null; // enlève le handler JS
  const original = backBtn.dataset.originalOnclick || "window.location.href='profil.html'";
  backBtn.setAttribute('onclick', original);
}


function enterListSelectionMode() {
  document.getElementById('menu').style.display = 'none';

  const cards = document.querySelectorAll('.list-card');
  cards.forEach(card => {
    card.classList.add('selectable');
    const box = card.querySelector('.list-select-box');
    if (box) {
      box.style.display = 'block';
      box.querySelector('input').checked = false;
    }
  });
  // Mise à jour du bouton "⋮"
  const toggle = document.getElementById('menuToggle');
  toggle.classList.add('selection-active');
  toggle.textContent = 'TOUT SÉLECTIONNER (0)';
  toggle.onclick = toggleAllSelection;

   // ➜ le bouton RETOUR devient ANNULER
  makeBackButtonCancel();

  // (on n’utilise plus le span #btnCancel)
  const cancelSpan = document.getElementById('btnCancel');
  if (cancelSpan) cancelSpan.style.display = 'none';
  updateListSelectionUI();
}

function toggleAllSelection() {
  const checkboxes = document.querySelectorAll('.list-card.selectable .list-checkbox');
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);

  checkboxes.forEach(cb => {
    cb.checked = !allChecked;
  });

  updateListSelectionUI();
}

function enableListSelectionMode() {
  document.getElementById('menu').style.display = 'none'; // Ferme le menu immédiatement

  const cards = document.querySelectorAll('.list-card');
  cards.forEach(card => {
    card.classList.add('selectable');
    const box = card.querySelector('.list-select-box');
    if (box) {
      box.style.display = 'block';
      box.querySelector('input').checked = false;
    }
  });
 // Met à jour le bouton "⋮" en mode sélection simple
  const toggle = document.getElementById('menuToggle');
  toggle.classList.add('selection-active');
  toggle.textContent = 'TOUT SÉLECTIONNER (0)';
  toggle.onclick = toggleAllSelection;


       // ➜ le bouton RETOUR devient ANNULER
  makeBackButtonCancel();

  // (on n’utilise plus le span #btnCancel)
  const cancelSpan = document.getElementById('btnCancel');
  if (cancelSpan) cancelSpan.style.display = 'none';
  updateListSelectionUI();
  }
    

function exitSelectionMode() {
  
  const cards = document.querySelectorAll('.list-card');
  cards.forEach(card => {
    card.classList.remove('selectable');
    const box = card.querySelector('.list-select-box');
    if (box) {
      box.style.display = 'none';
      const input = box.querySelector('input');
      if (input) input.checked = false;
    }
  });

  // 2. Masque le context menu si ouvert
  const menu = document.getElementById('menu');
  if (menu) menu.style.display = 'none';


  // 3. Masque la barre d'actions
  const selectionBar = document.getElementById('selectionActions');
  if (selectionBar) selectionBar.style.display = 'none';
  
restoreBackButton();

  const toggle = document.getElementById('menuToggle');
   if (toggle) {
  toggle.classList.remove('selection-active');
  toggle.textContent = 'PLUS';
  toggle.onclick = toggleContextMenu;
}
}


function renameSelectedList() {
  const checked = document.querySelector('.list-card.selectable.list-checkbox:checked');
  if (!checked) return;

  const wrapper = checked.closest('.list-wrapper');
  const id = wrapper?.dataset.id;
  const titleEl = wrapper.querySelector('.list-card-title');
  const oldTitle = titleEl?.textContent || '';
  const newTitle = prompt("Nouveau nom de la liste :", oldTitle);
  if (!newTitle || newTitle === oldTitle) return;
    titleEl.textContent = newTitle;
     const lists = getLists();
  const found = lists.find(l => l.id === id);
  if (found) {
    found.title = newTitle;
  saveLists(lists);

  }

  updateListSelectionUI();
}

function deleteSelectedLists() {
  const checked = document.querySelectorAll('.list-card.selectable .list-checkbox:checked');
  if (checked.length === 0) return;

  if (!confirm("Supprimer les listes sélectionnées ?")) return;
  
  const idsToDelete = [];
  checked.forEach(cb => {
    const wrapper = cb.closest('.list-wrapper');
    const id = wrapper?.dataset.id;
    if (id) {
      idsToDelete.push(id);
      wrapper.remove(); // retirer du DOM
    }
  });

    // Supprimer du localStorage
    const lists = getLists();
    const updated = lists.filter(l => !idsToDelete.includes(l.id));
  saveLists(updated);

  updateEmptyMessage();
  updateListCount();
  updateListSelectionUI();
}
  
    
function renderLists() {
  const container = document.getElementById("listContainer");
  const lists = getLists();
  container.innerHTML = '';

  lists.forEach(list => {
    const count = Array.isArray(list.items) ? list.items.length : 0;

    const wrapper = document.createElement('div');
    wrapper.className = 'list-wrapper';
    wrapper.dataset.id = list.id; // ✅ on garde l'id pour rename/delete

    const card = document.createElement('a');
    card.className = 'list-card';
    card.href = `liste-detail.html?id=${encodeURIComponent(list.id)}`;
    card.innerHTML = `
      <div class="list-covers-grid"></div>

      <!-- ✅ pastille de sélection (cachée par défaut) -->
      <div class="list-select-box" style="display:none">
        <label class="custom-check-wrapper">
          <input type="checkbox" class="list-checkbox" />
          <span class="custom-check"></span>
        </label>
      </div>
    `;

    const info = document.createElement('div');
    info.className = 'list-info';
    info.innerHTML = `
      <div class="list-card-title">${(list.title||'SANS NOM').toUpperCase()}</div>
      <div class="list-card-count">${count} article${count>1?'s':''}</div>
    `;

    wrapper.appendChild(card);
    wrapper.appendChild(info);
    container.appendChild(wrapper);
  });
}

// ✅ Un seul init au chargement
document.addEventListener('DOMContentLoaded', () => {
  renderLists();
  updateEmptyMessage();
  updateListCount();
});
   

// ✅ Quand on coche/décoche une liste, on met à jour la barre d’actions
document.addEventListener('change', (e) => {
  if (e.target.matches('.list-checkbox')) {
    updateListSelectionUI();
  }
});

// ✅ En mode sélection : cliquer sur la carte => toggle la case (pas de navigation)
document.addEventListener('click', (e) => {
  const card = e.target.closest('.list-card');
  if (!card) return;

  if (card.classList.contains('selectable')) {
    // si on ne clique pas directement sur la pastille, on toggle la case
    if (!e.target.closest('.list-select-box')) {
      e.preventDefault(); // empêche le lien vers listes-detail
      const cb = card.querySelector('.list-checkbox');
      if (cb) {
        cb.checked = !cb.checked;
        updateListSelectionUI();
      }
    } else {
      e.preventDefault(); // clic sur la pastille => pas de navigation non plus
    }
  }
});


    
  </script>
<div class="selection-actions" id="selectionActions" style="display: none;">
  <button onclick="renameSelectedList()">RENOMMER</button>
  <button onclick="deleteSelectedLists()">SUPPRIMER</button>
</div>
</body>
</html>
