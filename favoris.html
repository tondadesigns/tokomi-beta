  <script>

    /* ====== FAVS RENDER + COUNTS ====== */
document.addEventListener("DOMContentLoaded", () => {
  renderFavorites();
  updateCounts();

  // Si favoris changent depuis une autre page/onglet
  window.addEventListener("storage", (e) => {
    if (e.key === "tokomi_favorites") {
      renderFavorites();
      updateCounts();
    }
  });

  // Délégation pour les cases à cocher rendues dynamiquement
  document.addEventListener('change', (ev) => {
    if (ev.target.matches('.product input[type="checkbox"]')) {
      const product = ev.target.closest('.product');
      if (!product) return;
      product.classList.toggle('selected', ev.target.checked);
      updateSelectionButtonsState(); // ta fonction existante
    }
  });
});

/* Helpers stockage */
function getFavorites() {
  return JSON.parse(localStorage.getItem("tokomi_favorites")) || [];
}
function setFavorites(arr) {
  localStorage.setItem("tokomi_favorites", JSON.stringify(arr));
}

function getCart() {
  return JSON.parse(localStorage.getItem("tokomi_cart_items")) || [];
}
function setCart(arr) {
  localStorage.setItem("tokomi_cart_items", JSON.stringify(arr));
}

/* Rendu dynamique des favoris */
function renderFavorites() {
  const container = document.getElementById("favorites-items");
  const favs = getFavorites();
  container.innerHTML = "";

  if (favs.length === 0) {
    container.innerHTML = `<p style="font-size:12px; padding: 0 16px;">Aucun favori pour l’instant.</p>`;
    // Met à jour le compteur affiché
    updateCounts();
    return;
  }
  // Une ligne par favori
  favs.forEach((item, index) => {
    const key = (item.id || item.slug || item.name || "") + "|" + (item.size || "");
    const row = document.createElement("div");
    // ⚠️ On garde .product pour ta logique de sélection
    row.className = "fav-row product";
    row.dataset.index = index;
    row.dataset.key = key;

    row.innerHTML = `
      <div class="fav-image" style="background-image:url('${item.image || ''}')"></div>

      <div class="fav-info">
        <div class="brand">${(item.brand || item.name || '').toString().toUpperCase()}</div>
        <div class="product-name">${(item.name || '').toString().toUpperCase()}</div>
        <div class="price">€${item.price}</div>

        <div class="shopping-bin">
          <button class="shopping-btn" onclick="moveFavoriteToCart(${index})">AJOUTER AU PANIER</button>
          <button class="shopping-btn" onclick="openAddFavToList(${index})">AJOUTER À LA LISTE</button>
          <button class="shopping-btn" onclick="removeFavorite(${index})">SUPPRIMER</button>
        </div>

        <!-- Checkbox pour ton mode sélection (cachée par défaut par ton CSS) -->
        <label class="selection-radio">
          <input type="checkbox"/>
          <span class="custom-check"></span>
        </label>
      </div>
    `;

    container.appendChild(row);
  });

  updateCounts();
}
  let _favIndexForList = null;

function openAddFavToList(index) {
  _favIndexForList = index;
  // Ouvre ton dropdown existant sans casser ta logique
  document.getElementById('selectionActions').style.display = 'none';
  document.getElementById('listeDropdown').classList.add('show');
}

  
/* Déplacer un favori vers le panier */
function moveFavoriteToCart(index) {
  const favs = getFavorites();
  const cart = getCart();
  const item = favs[index];
  if (!item) return;

  const key = (item.id || item.slug || item.name) + "|" + (item.size || "");
  const existing = cart.find(c => ((c.id || c.slug || c.name) + "|" + (c.size || "")) === key);

  if (existing) {
    existing.quantity = (existing.quantity || 1) + 1;
  } else {
    cart.push({ ...item, quantity: item.quantity || 1 });
  }

  // Retirer des favoris
  favs.splice(index, 1);

  setCart(cart);
  setFavorites(favs);

  renderFavorites();
  updateCounts();
}

/* Supprimer un favori (bouton individuel) */
function removeFavorite(index) {
  const favs = getFavorites();
  favs.splice(index, 1);
  setFavorites(favs);
  renderFavorites();
  updateCounts();
}

/* Compteurs dans l’onglet (IDs avec tirets) */
function updateCounts() {
  const cart = getCart();
  const favs = getFavorites();
  const cartCount = document.getElementById("cart-count");
  const favoritesCount = document.getElementById("favorites-count");

  if (cartCount) cartCount.textContent = cart.length;
  if (favoritesCount) favoritesCount.textContent = favs.length || 0;
}

/* Compat : ta fonction existante appelle updateFavoritesCount().
   On la redéfinit pour s’aligner sur le stockage plutôt que compter le DOM. */
function updateFavoritesCount() {
  const favoritesCount = document.getElementById('favorites-count');
  if (favoritesCount) favoritesCount.textContent = getFavorites().length;
}
    
    function toggleContextMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function enterSelectionMode() {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('selectionActions').style.display = 'none';

      document.querySelectorAll('.product').forEach(p => { 
      p.classList.add('selectable');
      p.classList.remove('selected');
      p.querySelector('input[type="checkbox"]').checked = false;
      });

      const toggle = document.getElementById('menuToggle');
      toggle.classList.add('selection-active');
      toggle.textContent = `TOUT SÉLECTIONNER (0)`;
      toggle.onclick = selectAllProducts;
      updateSelectionButtonsState();
      document.getElementById('btnCancel').style.display = 'inline-block';

    }
document.querySelectorAll('.product input[type="checkbox"]').forEach(input => {
  input.addEventListener('change', () => {
    const product = input.closest('.product');
    if (input.checked) {
      product.classList.add('selected');
    } else {
      product.classList.remove('selected');
    }
    updateSelectionButtonsState();
  });
});

    function selectAllProducts() {
      const products = document.querySelectorAll('.product.selectable');
      const allSelected = Array.from(products).every(p => p.classList.contains('selected'));

      products.forEach(p => {
        p.classList.toggle('selected' , !allSelected);
        p.querySelector('input[type="checkbox"]').checked = !allSelected;
      });
      updateSelectionButtonsState();
    }

function deleteSelectedProducts() {
  const selectedProducts = document.querySelectorAll('.product.selectable.selected');
   if (selectedProducts.length === 0) return;

  const message = `Supprimer ${selectedProducts.length} article${selectedProducts.length > 1 ? 's' : ''} ?`;
  showConfirmationModal(message, () => {
    selectedProducts.forEach(product => product.remove());
  // Après suppression, quitter le mode sélection
  exitSelectionMode();
  updateFavoritesCount(); // Met à jour le compteur
  });
}

    function exitSelectionMode() {
      document.querySelectorAll('.product').forEach(p =>{
      p.classList.remove('selected');
      p.classList.remove('selectable');
  });
      document.getElementById('menu').style.display = 'none';
      document.getElementById('selectionActions').style.display = 'none';
      document.getElementById('listeDropdown').style.display = 'none';

      const toggle = document.getElementById('menuToggle');
      toggle.classList.remove('selection-active');
      document.getElementById('btnCancel').style.display = 'none';
      toggle.textContent = 'PLUS';
      toggle.onclick = toggleContextMenu;

      document.getElementById('btnAddToList').disabled = true;
      document.getElementById('btnCancel').disabled = true;
    }


    function showListeDropdown(e) {
      e.stopPropagation();
      document.getElementById('selectionActions').style.display = 'none';
      document.getElementById('listeDropdown').classList.add('show');
    }

    document.addEventListener('click', () => {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('listeDropdown').classList.remove('show');
    });
    function selectProduct(imgElement) {
  const product = imgElement.closest('.product');
  if (!product.classList.contains('selectable')) return;
const checkbox = product.querySelector('input[type="checkbox"]');
  checkbox.checked = !checkbox.checked;

  if (checkbox.checked) {
    product.classList.add('selected');
  } else {
    product.classList.remove('selected');
  }

  updateSelectionButtonsState();
}

    
  function updateSelectionButtonsState() {
  const allProducts = document.querySelectorAll('.product.selectable');
  const selectedProducts = document.querySelectorAll('.product.selectable.selected');
  const selectedCount = selectedProducts.length;

  const btnAdd = document.getElementById('btnAddToList');
  const btnDelete = document.getElementById('btnDelete');
  const actions = document.getElementById('selectionActions');
  const toggle = document.getElementById('menuToggle');

  const shouldEnable = selectedCount > 0;
  btnAdd.disabled = !shouldEnable;
  btnDelete.disabled = !shouldEnable;

  actions.style.display = selectedCount > 0 ? 'flex' : 'none';

  if (toggle.classList.contains('selection-active')) {
    if (selectedCount === allProducts.length && selectedCount > 0) {
      toggle.textContent = `TOUT DÉSÉLECTIONNER (${selectedCount})`;
    } else {
      toggle.textContent = `TOUT SÉLECTIONNER (${selectedCount})`;
  }
 }
}
document.querySelectorAll('.list-card-item').forEach(item => {
  item.addEventListener('click', () => {
    const listName = item.textContent.trim();
    alert(`Ajouté à "${listName.toUpperCase()}"`);
    // Optionnel : fermer le menu après ajout
    document.getElementById('listeDropdown').classList.remove('show');
  });
});


function showConfirmationModal(message, onConfirm) {
  const modal = document.getElementById("confirmModal");
  const confirmText = document.getElementById("confirmText");
  const confirmBtn = document.getElementById("confirmBtn");

  confirmText.textContent = message;

  confirmBtn.onclick = () => {
    closeModal();
    onConfirm();
  };

  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("confirmModal").style.display = "none";
}

<script>
  // Charger dynamiquement les listes dans le dropdown
  function loadListsInDropdown() {
    const raw = localStorage.getItem("tokomiLists");
    const content = document.getElementById("listeDropdownContent");
    content.innerHTML = "";
    if (!raw) return;

    const lists = JSON.parse(raw);

    lists.forEach(list => {
      const item = document.createElement("div");
      item.className = "list-card-item";
      item.textContent = list.title?.toUpperCase() || "SANS NOM";
      item.onclick = () => {
        addSelectedProductsToList(list.id);
        alert(`Ajouté à "${list.title}"`);
        document.getElementById("listeDropdown").classList.remove("show");
        // Tu peux ici appeler une fonction pour ajouter un produit à cette liste
      };

      content.appendChild(item);
    });
  }

  function openListeDropdown() {
      loadListsInDropdown();
      document.getElementById("listeDropdown").classList.add("show");
    }

    function addSelectedProductsToList(listId) {
      const checkboxes = document.querySelectorAll(".product-checkbox:checked");
      const products = Array.from(checkboxes).map(cb => {
        const p = cb.closest(".product");
        return {
          id: p.dataset.id,
          brand: p.dataset.brand,
          name: p.dataset.name,
          price: p.dataset.price
        };
      });

      const raw = localStorage.getItem("tokomiLists");
      if (!raw) return;

      const lists = JSON.parse(raw);
      const list = lists.find(l => l.id === listId);
      if (!list) return;

      list.products = list.products || [];
      products.forEach(p => {
        if (!list.products.find(existing => existing.id === p.id)) {
          list.products.push(p);
        }
      });

      localStorage.setItem("tokomiLists", JSON.stringify(lists));
      alert(`Ajouté à "${list.title}"`);
    }

    // Init example data if not existing
    window.addEventListener("DOMContentLoaded", () => {
      if (!localStorage.getItem("tokomiLists")) {
        const example = [
          { id: "1", title: "Préférés", products: [] },
          { id: "2", title: "Cadeaux", products: [] }
        ];
        localStorage.setItem("tokomiLists", JSON.stringify(example));
      }
    });


</script>
<script>
  function updateFavoritesCount() {
   
    // Compter le nombre de produits affichés dans la page
    const products = document.querySelectorAll('.product');
    const count = products.length;

    // Cibler l'élément qui affiche le compteur
    const counter = document.getElementById('favorites-count');
    if (counter) {
      counter.textContent = count;
   
    }
  }

  // Exécuté au chargement de la page
  document.addEventListener("DOMContentLoaded", updateFavoritesCount);

  // 🔁 Appelle cette fonction après tout ajout ou suppression de favoris
  function addToFavorites(product) {
    const raw = localStorage.getItem("tokomiFavorites");
    const favorites = raw ? JSON.parse(raw) : [];
    favorites.push(product);
    localStorage.setItem("tokomiFavorites", JSON.stringify(favorites));
    updateFavoritesCount();
  }

  function removeFromFavorites(productId) {
    const raw = localStorage.getItem("tokomiFavorites");
    const favorites = raw ? JSON.parse(raw) : [];
    const updated = favorites.filter(p => p.id !== productId);
    localStorage.setItem("tokomiFavorites", JSON.stringify(updated));
    updateFavoritesCount();
  }
</script>
