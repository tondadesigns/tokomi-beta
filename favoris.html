  <script>

    /* ====== FAVS RENDER + COUNTS ====== */
document.addEventListener("DOMContentLoaded", () => {
  renderFavorites();
  updateCounts();

  // Si favoris changent depuis une autre page/onglet
  window.addEventListener("storage", (e) => {
    if (e.key === "tokomi_favorites") {
      renderFavorites();
      updateCounts();
    }
  });

  // Délégation pour les cases à cocher rendues dynamiquement
  document.addEventListener('change', (ev) => {
    if (ev.target.matches('.product input[type="checkbox"]')) {
      const product = ev.target.closest('.product');
      if (!product) return;
      product.classList.toggle('selected', ev.target.checked);
      updateSelectionButtonsState(); // ta fonction existante
    }
  });
});

/* Helpers stockage */
function getFavorites() {
  return JSON.parse(localStorage.getItem("tokomi_favorites")) || [];
}
function setFavorites(arr) {
  localStorage.setItem("tokomi_favorites", JSON.stringify(arr));
}

function getCart() {
  return JSON.parse(localStorage.getItem("tokomi_cart_items")) || [];
}
function setCart(arr) {
  localStorage.setItem("tokomi_cart_items", JSON.stringify(arr));
}

/* Rendu dynamique des favoris */
function renderFavorites() {
  const container = document.getElementById("favorites-items");
  const favs = getFavorites();
  container.innerHTML = "";

  if (favs.length === 0) {
    container.innerHTML = `<p style="font-size:12px; padding: 0 16px;">Aucun favori pour l’instant.</p>`;
    // Met à jour le compteur affiché
    updateCounts();
    return;
  }
  // Une ligne par favori
  favs.forEach((item, index) => {
    const key = (item.id || item.slug || item.name || "") + "|" + (item.size || "");
    const row = document.createElement("div");
    // ⚠️ On garde .product pour ta logique de sélection
    row.className = "fav-row product";
    row.dataset.index = index;
    row.dataset.key = key;

    row.innerHTML = `
      <div class="fav-image" style="background-image:url('${item.image || ''}')"></div>

      <div class="fav-info">
        <div class="brand">${(item.brand || item.name || '').toString().toUpperCase()}</div>
        <div class="product-name">${(item.name || '').toString().toUpperCase()}</div>
        <div class="price">€${item.price}</div>

        <div class="shopping-bin">
          <button class="shopping-btn" onclick="moveFavoriteToCart(${index})">AJOUTER AU PANIER</button>
          <button class="shopping-btn" onclick="openAddFavToList(${index})">AJOUTER À LA LISTE</button>
          <button class="shopping-btn" onclick="removeFavorite(${index})">SUPPRIMER</button>
        </div>

        <!-- Checkbox pour ton mode sélection (cachée par défaut par ton CSS) -->
        <label class="selection-radio">
          <input type="checkbox"/>
          <span class="custom-check"></span>
        </label>
      </div>
    `;

    container.appendChild(row);
  });

  updateCounts();
}



  
/* Déplacer un favori vers le panier */
function moveFavoriteToCart(index) {
  const favs = getFavorites();
  const cart = getCart();
  const item = favs[index];
  if (!item) return;

  const key = (item.id || item.slug || item.name) + "|" + (item.size || "");
  const existing = cart.find(c => ((c.id || c.slug || c.name) + "|" + (c.size || "")) === key);

  if (existing) {
    existing.quantity = (existing.quantity || 1) + 1;
  } else {
    cart.push({ ...item, quantity: item.quantity || 1 });
  }

  // Retirer des favoris
  favs.splice(index, 1);

  setCart(cart);
  setFavorites(favs);

  renderFavorites();
  updateCounts();
}

/* Supprimer un favori (bouton individuel) */
function removeFavorite(index) {
  const favs = getFavorites();
  favs.splice(index, 1);
  setFavorites(favs);
  renderFavorites();
  updateCounts();
}

/* Compteurs dans l’onglet (IDs avec tirets) */
function updateCounts() {
  const cart = getCart();
  const favs = getFavorites();
  const cartCount = document.getElementById("cart-count");
  const favoritesCount = document.getElementById("favorites-count");

  if (cartCount) cartCount.textContent = cart.length;
  if (favoritesCount) favoritesCount.textContent = favs.length || 0;
}

/* Compat : ta fonction existante appelle updateFavoritesCount().
   On la redéfinit pour s’aligner sur le stockage plutôt que compter le DOM. */
function updateFavoritesCount() {
  const favoritesCount = document.getElementById('favorites-count');
  if (favoritesCount) favoritesCount.textContent = getFavorites().length;
}
    
    function toggleContextMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function enterSelectionMode() {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('selectionActions').style.display = 'none';

      document.querySelectorAll('.product').forEach(p => { 
      p.classList.add('selectable');
      p.classList.remove('selected');
      p.querySelector('input[type="checkbox"]').checked = false;
      });

      const toggle = document.getElementById('menuToggle');
      toggle.classList.add('selection-active');
      toggle.textContent = `TOUT SÉLECTIONNER (0)`;
      toggle.onclick = selectAllProducts;
      updateSelectionButtonsState();
      document.getElementById('btnCancel').style.display = 'inline-block';

    }
document.querySelectorAll('.product input[type="checkbox"]').forEach(input => {
  input.addEventListener('change', () => {
    const product = input.closest('.product');
    if (input.checked) {
      product.classList.add('selected');
    } else {
      product.classList.remove('selected');
    }
    updateSelectionButtonsState();
  });
});

    function selectAllProducts() {
      const products = document.querySelectorAll('.product.selectable');
      const allSelected = Array.from(products).every(p => p.classList.contains('selected'));

      products.forEach(p => {
        p.classList.toggle('selected' , !allSelected);
        p.querySelector('input[type="checkbox"]').checked = !allSelected;
      });
      updateSelectionButtonsState();
    }

function deleteSelectedProducts() {
  const selectedProducts = document.querySelectorAll('.product.selectable.selected');
   if (selectedProducts.length === 0) return;

  const message = `Supprimer ${selectedProducts.length} article${selectedProducts.length > 1 ? 's' : ''} ?`;
  showConfirmationModal(message, () => {
    selectedProducts.forEach(product => product.remove());
  // Après suppression, quitter le mode sélection
  exitSelectionMode();
  updateFavoritesCount(); // Met à jour le compteur
  });
}

    function exitSelectionMode() {
      document.querySelectorAll('.product').forEach(p =>{
      p.classList.remove('selected');
      p.classList.remove('selectable');
  });
      document.getElementById('menu').style.display = 'none';
      document.getElementById('selectionActions').style.display = 'none';
      document.getElementById('listeDropdown').style.display = 'none';

      const toggle = document.getElementById('menuToggle');
      toggle.classList.remove('selection-active');
      document.getElementById('btnCancel').style.display = 'none';
      toggle.textContent = 'PLUS';
      toggle.onclick = toggleContextMenu;

      document.getElementById('btnAddToList').disabled = true;
      document.getElementById('btnCancel').disabled = true;
    }


    function showListeDropdown(e) {
      e.stopPropagation();
      document.getElementById('selectionActions').style.display = 'none';
      document.getElementById('listeDropdown').classList.add('show');
    }

   
  
    function selectProduct(imgElement) {
  const product = imgElement.closest('.product');
  if (!product.classList.contains('selectable')) return;
const checkbox = product.querySelector('input[type="checkbox"]');
  checkbox.checked = !checkbox.checked;

  if (checkbox.checked) {
    product.classList.add('selected');
  } else {
    product.classList.remove('selected');
  }

  updateSelectionButtonsState();
}

    
  function updateSelectionButtonsState() {
  const allProducts = document.querySelectorAll('.product.selectable');
  const selectedProducts = document.querySelectorAll('.product.selectable.selected');
  const selectedCount = selectedProducts.length;

  const btnAdd = document.getElementById('btnAddToList');
  const btnDelete = document.getElementById('btnDelete');
  const actions = document.getElementById('selectionActions');
  const toggle = document.getElementById('menuToggle');

  const shouldEnable = selectedCount > 0;
  btnAdd.disabled = !shouldEnable;
  btnDelete.disabled = !shouldEnable;

  actions.style.display = selectedCount > 0 ? 'flex' : 'none';

  if (toggle.classList.contains('selection-active')) {
    if (selectedCount === allProducts.length && selectedCount > 0) {
      toggle.textContent = `TOUT DÉSÉLECTIONNER (${selectedCount})`;
    } else {
      toggle.textContent = `TOUT SÉLECTIONNER (${selectedCount})`;
  }
 }
}



function showConfirmationModal(message, onConfirm) {
  const modal = document.getElementById("confirmModal");
  const confirmText = document.getElementById("confirmText");
  const confirmBtn = document.getElementById("confirmBtn");

  confirmText.textContent = message;

  confirmBtn.onclick = () => {
    closeModal();
    onConfirm();
  };

  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("confirmModal").style.display = "none";
}


  </script>

<!-- MODAL : AJOUTER À -->
<div class="liste-dropdown" id="listeDropdown" aria-hidden="true">
  <div class="liste-dropdown-content" id="listeDropdownContent" role="dialog" aria-modal="true">
    <div class="liste-header">
      <h4>AJOUTER À</h4>
      <button class="liste-close" onclick="closeListeDropdown()" aria-label="Fermer">FERMER</button>
    </div>

    <!-- Listes vont être injectées ici -->
    <div id="listeItems" class="liste-items"></div>

    <div class="liste-footer">
      <a href="listes.html" class="liste-manage">Gérer les listes</a>
    </div>
  </div>
</div>
<script>
/* === Stockage partagé avec listes.html === */
const LS_LISTS_KEY = 'tokomiLists';
/* === Gestion modal === */
let currentFavIndex = null; // l’index du produit cliqué dans favoris
/** Retourne un tableau de listes: [{id, title, items:[]}, ...] */
function getLists() {
  try { return JSON.parse(localStorage.getItem(LS_LISTS_KEY)) || []; }
  catch { return []; }
}
function saveLists(lists) {
    localStorage.setItem(LS_LISTS_KEY, JSON.stringify(lists));
  }
  function ensureListsSeed() {
    if (!localStorage.getItem(LS_LISTS_KEY)) {
      saveLists([
        { id: '1', title: 'Préférés', items: [] },
        { id: '2', title: 'Cadeaux', items: [] }
      ]);
    }
  }

function openAddFavToList(index) {
  currentFavIndex = index;
  renderListsInModal();
  const modal = document.getElementById('listeDropdown');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  // lock scroll
  document.body.style.overflow = 'hidden';
}

function closeListeDropdown() {
  const modal = document.getElementById('listeDropdown');
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

/* Injecte les listes dans le modal */
function renderListsInModal() {
  const container = document.getElementById('listeItems');
  container.innerHTML = '';

  const lists = getLists();
  if (!lists.length) {
    container.innerHTML = `
      <div style="padding:12px; font-size:13px;">
        Aucune liste trouvée.<br/>
        <a href="#" onclick="openCreateListModal(event)" style="text-decoration:underline; color:#111;">Créer une liste</a>
      </div>`;
    return;
  }

  lists.forEach(list => {
    const div = document.createElement('div');
    div.className = 'list-card-item';
    div.style.display = 'flex';
    div.style.justifyContent = 'space-between';
    div.style.alignItems = 'center';
    div.innerHTML = `
      <div>
        <div>${(list.title || 'Sans nom').toUpperCase()}</div>
        <div class="list-meta">${(list.items?.length || 0)} élément(s)</div>
      </div>
      <div></div>
    `;
    div.onclick = () => addSelectedFavoriteToList(list.id);
    container.appendChild(div);
  });
}

/* === Ajout du favori sélectionné dans la liste choisie ===
   Adapte ICI la façon dont tu récupères un favori depuis favoris.html.
   Deux options ci-dessous : A) via DOM dataset, B) via localStorage. 
   Garde une seule option selon ta structure actuelle. 
*/

/* A) Exemple via DOM dataset : 
   Sur chaque carte favori, ajoute data-* (id, title, price, image, etc.)
   <div class="fav-card" data-id="sku123" data-title="Sac" data-price="199" data-image="...">
     ...
     <button class="shopping-btn" onclick="openAddFavToList( INDEX )">AJOUTER À LA LISTE</button>
   </div>
*/


/* B) Exemple via localStorage (si tu stockes déjà tes favoris) :
   Remplace 'tokomi_favorites' par ta clé réelle.
*/
function getFavoriteByIndex_LS(index) {
const arr = JSON.parse(localStorage.getItem('tokomi_favorites')) || [];
return arr[index] || null;
}

function addSelectedFavoriteToList(listId) {
  // Récupère le produit courant (décommente la source que tu utilises)
  const product = getFavoriteByIndex_LS(currentFavIndex);
  // const product = getFavoriteByIndex_LS(currentFavIndex);

  if (!product) {
    alert("Impossible de récupérer l'article sélectionné.");
    return;
  }

  const lists = getLists();
  const target = lists.find(l => String(l.id) === String(listId));
  if (!target) { alert("Liste introuvable."); return;
  }
  target.items = Array.isArray(target.items) ? target.items : [];
  
  // évite les doublons sur la base de id + title
  
  const pKey = (product.id || product.slug || product.name || '') + '|' + (product.size || '');
  const exists = target.items.some(it => ((it.id || it.slug || it.name || '') + '|' + (it.size || '')) === pKey);
  if (!exists) {
    target.items.push({...product, addedAt: new Date().toISOString()
    });
    saveLists(lists);
    }
   
  closeListeDropdown();
  // Feedback rapide
  alert(`Ajouté à « ${target.title || 'Sans nom'} ».`);
}

/* Optionnel : fermer avec ESC */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeListeDropdown();
});
  /* ---------- MODAL "CRÉER UNE LISTE" ---------- */
function openCreateListModal(ev) {
  if (ev) ev.preventDefault();
  const m = document.getElementById('createListModal');
  m.classList.add('show');
  m.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  // focus input
  setTimeout(() => document.getElementById('listName')?.focus(), 0);
}
function closeCreateListModal() {
  const m = document.getElementById('createListModal');
  m.classList.remove('show');
  m.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

function createList() {
  const input = document.getElementById('listName');
  const title = (input.value || '').trim();
  if (!title) { input.focus(); return; }

  const lists = getLists();
  const id = Date.now().toString();
  lists.push({ id, title, items: [] });
  saveLists(lists);

  // reset + fermer
  input.value = '';
  closeCreateListModal();

  // Rafraîchir le modal d’ajout (si ouvert) pour voir la nouvelle liste
  if (document.getElementById('listeDropdown')?.classList.contains('show')) {
    renderListsInModal();
  }

  alert(`Liste « ${title} » créée.`);
}

/* Fermer la modale création avec ESC + clic hors contenu */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCreateListModal();
});
document.getElementById('createListModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'createListModal') closeCreateListModal();
});

  document.addEventListener('DOMContentLoaded', ensureListsSeed);
</script>

            style="position: absolute; top: 9px; right: 8px; background: none; border: none;
                   font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 300;
                   cursor: pointer; color: black;">
      FERMER
    </button>

    <div class="create-list-form" id="createListForm">
      <input type="text" id="listName" placeholder="NOM DE LA LISTE" />
      <button onclick="createList()">CRÉER</button>
    </div>
  </div>
</div>
