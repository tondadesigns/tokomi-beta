<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adresse Livraison – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background: white;
    }

    .btn-retouracp {
      margin-top: 57px;
      margin-left: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 300;
      text-transform: uppercase;
      text-decoration: none;
      color: black;
      background: none;
      border: none;
      cursor: pointer;
    }

    #address-form {
      display: flex !important;
      flex-direction: column;
      font-size: 10px;
      gap: 12px;
      margin: 24px 16px 230px 16px;
    }

    .address-input {
      width: 100%;
      padding: 8px 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 300;
      border: none !important;
      border-bottom: 1px solid #eee !important;
      outline: none;
      background: white;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .submit-address-btn {
      width: 100%;
      margin-top: 16px;
      background: black;
      color: white;
      border: none;
      font-size: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-bottom: 24px;
      padding: 10px;
    }

    .submit-address-btn:hover {
      background: #222;
    }

    .autocomplete-wrapper {
      position: relative;
    }

    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      max-height: 180px;
      overflow-y: auto;
      z-index: 1000;
      list-style: none;
      margin: 0;
      padding: 0;
      display: none;
    }

    .autocomplete-list li {
      padding: 8px 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .autocomplete-list li:hover {
      background-color: #f0f0f0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="address-page">
    <div class="header">
      <button class="btn-retouracp" onclick="window.location.href='checkout.html'">RETOUR</button>

      <h2 style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 12px; margin-top: 12px;margin-left: 16px;">VOTRE ADRESSE DE LIVRAISON</h2>
      <form id="address-form" onsubmit="saveAddress(event)">
        <input type="text" placeholder="PRÉNOM" required class="address-input" />
        <input type="text" placeholder="NOM DE FAMILLE" required class="address-input" />
        <input type="text" placeholder="ADRESSE" required class="address-input" />
        <input type="text" placeholder="VILLE" required class="address-input" />
        <input type="text" placeholder="CODE POSTAL" required class="address-input" />
        <div class="autocomplete-wrapper">
          <label for="countryInput" style="font-size: 10px; margin-bottom: 4px;"></label>
          <input type="text" id="countryInput" class="address-input" placeholder="pays" autocomplete="off" required />
          <ul id="countryList" class="autocomplete-list"></ul>
        </div>
        <input type="text" placeholder="NUMÉRO DE TÉLÉPHONE" required class="address-input" />
        <button type="submit" class="submit-address-btn">ENREGISTRER</button>
      </form>
    </div>
  </div>
<script>
const countries = [
  "Afghanistan", "Afrique du Sud", "Albanie", "Algérie", "Allemagne", "Andorre", "Angola", "Argentine",
  "Arménie", "Australie", "Autriche", "Azerbaïdjan", "Belgique", "Bénin", "Botswana", "Brésil", "Burkina Faso",
  "Burundi", "Cameroun", "Canada", "Chili", "Chine", "Colombie", "Comores", "Congo", "Croatie", "Danemark",
  "Djibouti", "Égypte", "Espagne", "États-Unis", "Éthiopie", "Finlande", "France", "Gabon", "Ghana", "Grèce",
  "Guinée", "Haïti", "Inde", "Indonésie", "Irlande", "Islande", "Italie", "Japon", "Kenya", "Liban",
  "Luxembourg", "Madagascar", "Malawi", "Mali", "Maroc", "Maurice", "Mexique", "Monaco", "Mozambique",
  "Namibie", "Niger", "Nigéria", "Norvège", "Nouvelle-Zélande", "Ouganda", "Pakistan", "Pays-Bas", "Pérou",
  "Philippines", "Pologne", "Portugal", "Qatar", "République Démocratique du Congo", "Roumanie", "Rwanda",
  "Sénégal", "Serbie", "Singapour", "Slovaquie", "Slovénie", "Somalie", "Suède", "Suisse", "Tanzanie",
  "Tchad", "Thaïlande", "Togo", "Tunisie", "Turquie", "Ukraine", "Uruguay", "Venezuela", "Vietnam", "Zambie", "Zimbabwe"
];

const countryDialCodes = {
  "Afghanistan": "+93", "Afrique du Sud": "+27", "Albanie": "+355", "Algérie": "+213", "Allemagne": "+49",
  "Andorre": "+376", "Angola": "+244", "Argentine": "+54", "Arménie": "+374", "Australie": "+61",
  "Autriche": "+43", "Azerbaïdjan": "+994", "Belgique": "+32", "Bénin": "+229", "Botswana": "+267",
  "Brésil": "+55", "Burkina Faso": "+226", "Burundi": "+257", "Cameroun": "+237", "Canada": "+1",
  "Chili": "+56", "Chine": "+86", "Colombie": "+57", "Comores": "+269", "Congo": "+242",
  "Croatie": "+385", "Danemark": "+45", "Djibouti": "+253", "Égypte": "+20", "Espagne": "+34",
  "États-Unis": "+1", "Éthiopie": "+251", "Finlande": "+358", "France": "+33", "Gabon": "+241",
  "Ghana": "+233", "Grèce": "+30", "Guinée": "+224", "Haïti": "+509", "Inde": "+91",
  "Indonésie": "+62", "Irlande": "+353", "Islande": "+354", "Italie": "+39", "Japon": "+81",
  "Kenya": "+254", "Liban": "+961", "Luxembourg": "+352", "Madagascar": "+261", "Malawi": "+265",
  "Mali": "+223", "Maroc": "+212", "Maurice": "+230", "Mexique": "+52", "Monaco": "+377",
  "Mozambique": "+258", "Namibie": "+264", "Niger": "+227", "Nigéria": "+234", "Norvège": "+47",
  "Nouvelle-Zélande": "+64", "Ouganda": "+256", "Pakistan": "+92", "Pays-Bas": "+31", "Pérou": "+51",
  "Philippines": "+63", "Pologne": "+48", "Portugal": "+351", "Qatar": "+974",
  "République Démocratique du Congo": "+243", "Roumanie": "+40", "Rwanda": "+250", "Sénégal": "+221",
  "Serbie": "+381", "Singapour": "+65", "Slovaquie": "+421", "Slovénie": "+386", "Somalie": "+252",
  "Suède": "+46", "Suisse": "+41", "Tanzanie": "+255", "Tchad": "+235", "Thaïlande": "+66",
  "Togo": "+228", "Tunisie": "+216", "Turquie": "+90", "Ukraine": "+380", "Uruguay": "+598",
  "Venezuela": "+58", "Vietnam": "+84", "Zambie": "+260", "Zimbabwe": "+263"
};
  
const input = document.getElementById('countryInput');
const list = document.getElementById('countryList');
const phoneInput = document.querySelector('input[placeholder="NUMÉRO DE TÉLÉPHONE"]');
  
input.addEventListener('input', function () {
  const query = this.value.toLowerCase();
  list.innerHTML = '';
  if (!query) {
    list.style.display = 'none';
    return;
  }

  const matches = countries.filter(country => country.toLowerCase().includes(query));
  matches.forEach(country => {
    const li = document.createElement('li');
    li.textContent = country;
    li.addEventListener('click', () => {
      input.value = country;
      list.innerHTML = '';
      list.style.display = 'none';

      const dialCode = countryDialCodes[country] || "";
  const phoneInput = document.querySelector('input[placeholder="NUMÉRO DE TÉLÉPHONE"]');
  if (phoneInput) {
    phoneInput.value = dialCode + " ";
  phoneInput.focus();
  // Positionner le curseur à la fin
  phoneInput.setSelectionRange(phoneInput.value.length, phoneInput.value.length);
  }
});
    list.appendChild(li);
  });

  list.style.display = matches.length ? 'block' : 'none';
});

document.addEventListener('click', function (e) {
  if (!document.querySelector('.autocomplete-wrapper').contains(e.target)) {
    list.style.display = 'none';
  }
});

function saveAddress(e) {
  e.preventDefault();

  const prenom = document.querySelector('input[placeholder="PRÉNOM"]').value.trim();
  const nom = document.querySelector('input[placeholder="NOM DE FAMILLE"]').value.trim();
  const adresse = document.querySelector('input[placeholder="ADRESSE"]').value.trim();
  const ville = document.querySelector('input[placeholder="VILLE"]').value.trim();
  const codePostal = document.querySelector('input[placeholder="CODE POSTAL"]').value.trim();
  const pays = document.getElementById("countryInput").value.trim();
  const telephone = document.querySelector('input[placeholder*="TÉLÉPHONE"]').value.trim();

  const formattedAddress = `${prenom} ${nom}
${adresse}
${ville}, ${codePostal}, ${pays}
${telephone}`;

  localStorage.setItem("tokomi_address", formattedAddress);

  // Rediriger vers checkout.html
  window.location.href = "checkout.html";
}



</script>

</body>
</html>
