<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Langue – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    .btn-retour {
      position: absolute;
      left: 10px;
      top: 54px;
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 300;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    .title {
      text-align: center;
      margin-top: 120px;
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .container {
      margin-top: 38px;
      padding: 40px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .langue-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
    }

    .langue-label {
      font-size: 12px;
      font-weight: 300;
      color: #333;
      text-transform: uppercase;
    }

    input[type="radio"] {
      display: none;
    }

    .custom-radio {
      width: 12px;
      height: 12px;
      border: 1px solid #333;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
    }

    .custom-radio::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s ease;
    }

    input[type="radio"]:checked + .custom-radio::after {
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <button class="btn-retour" onclick="location.href='profil.html'">RETOUR</button>

  <div class="title">Langue</div>

  <div class="container">
    <label class="langue-option">
      <span class="langue-label">Français</span>
      <input type="radio" name="langue" id="fr">
      <span class="custom-radio" onclick="selectLangue('fr')"></span>
    </label>
    <label class="langue-option">
      <span class="langue-label">Anglais</span>
      <input type="radio" name="langue" id="en">
      <span class="custom-radio" onclick="selectLangue('en')"></span>
    </label>
    
  </div>

  <script>
  const LANG_KEY = 'tokomi_lang';

  // Enregistre et applique la langue (sans redirection)
  function applyLang(lang) {
    const safe = (lang === 'en') ? 'en' : 'fr';
    localStorage.setItem(LANG_KEY, safe);
    document.documentElement.setAttribute('lang', safe);
    // Si tu veux rediriger juste après le choix, dé-commente la ligne ci-dessous :
    // location.href = 'accueil.html';
  }

  // Garde ta signature et tes appels existants
  function selectLangue(id) {
    const input = document.getElementById(id);
    if (!input) return;
    input.checked = true;
    applyLang(id); // id est 'fr' ou 'en'
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Pré-sélection selon la préférence enregistrée (fr par défaut)
    const saved = localStorage.getItem(LANG_KEY) || 'fr';
    const el = document.getElementById(saved);
    if (el) el.checked = true;
    document.documentElement.setAttribute('lang', saved);

    // Si l’utilisateur change la radio via clavier/label, on persiste aussi
    const fr = document.getElementById('fr');
    const en = document.getElementById('en');
    fr?.addEventListener('change', () => fr.checked && applyLang('fr'));
    en?.addEventListener('change', () => en.checked && applyLang('en'));
  });
</script>


</body>
</html>
