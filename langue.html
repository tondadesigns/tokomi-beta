<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Langue – Tokomi</title>
  <style>
    body { font-family:'Space Grotesk', sans-serif; margin:0; padding:0; background:#fff; }
    .btn-retour {
      position:absolute; left:10px; top:54px; color:#000; background:none; border:none;
      font-size:11px; font-weight:300; cursor:pointer; font-family:'Space Grotesk', sans-serif;
      z-index: 9999; /* Toujours cliquable */
    }
    .title { text-align:center; margin-top:120px; font-size:13px; font-weight:600; text-transform:uppercase; }
    .container { margin-top:38px; padding:40px 24px; display:flex; flex-direction:column; gap:24px; }
    .langue-option { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; }
    .langue-label { font-size:11px; font-weight:300; color:#333; text-transform:uppercase; }
    input[type="radio"] { display:none; }
    .custom-radio { width:12px; height:12px; border:1px solid #333; border-radius:50%; position:relative; cursor:pointer; }
    .custom-radio::after {
      content:""; width:6px; height:6px; background:#000; border-radius:50%; position:absolute;
      top:50%; left:50%; transform:translate(-50%,-50%) scale(0); transition:transform .2s ease;
    }
    input[type="radio"]:checked + .custom-radio::after { transform:translate(-50%,-50%) scale(1); }
  </style>
  <!-- Module i18n commun -->
  <script src="/js/tokomi-i18n.js"></script>
</head>
<body>

  <!-- ✅ Redirection vers profil.html -->
  <button class="btn-retour" id="btnRetour" type="button"
          data-i18n="common.back"
          onclick="location.href='profil.html'">RETOUR</button>

  <div class="title" id="pageTitle" data-i18n="common.language">Langue</div>

  <div class="container">
    <label class="langue-option">
      <span class="langue-label" id="labelFr" data-i18n="common.french">Français</span>
      <input type="radio" name="langue" id="fr">
      <span class="custom-radio" onclick="selectLangue('fr')"></span>
    </label>
    <label class="langue-option">
      <span class="langue-label" id="labelEn" data-i18n="common.english">Anglais</span>
      <input type="radio" name="langue" id="en">
      <span class="custom-radio" onclick="selectLangue('en')"></span>
    </label>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const lang = window.tokomiI18n?.getLang() || 'fr';
      document.getElementById(lang)?.setAttribute('checked', 'checked');

      // Bouton retour (sécurité si onclick direct cassé)
      document.getElementById('btnRetour').addEventListener('click', () => {
        location.href = 'profil.html';
      });

      // Radios
      document.getElementById('fr')?.addEventListener('change', () => selectLangue('fr'));
      document.getElementById('en')?.addEventListener('change', () => selectLangue('en'));
    });

    // Choix langue → redirige vers profil.html
    function selectLangue(id) {
      const i18n = window.tokomiI18n;
      if (i18n && typeof i18n.setLang === 'function') {
        i18n.setLang(id, { redirect: true, redirectTo: 'profil.html' });
      } else {
        localStorage.setItem('tokomi_lang', (id === 'en') ? 'en' : 'fr');
        document.documentElement.setAttribute('lang', (id === 'en') ? 'en' : 'fr');
        location.href = 'profil.html';
      }
    }
  </script>
</body>
</html>
