<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – Tokomi</title>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    .btn-retour {
      position: absolute;
      left: 10px;
      top: 54px;
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 300;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }

    .title {
      text-align: center;
      margin-top: 120px;
      font-size: 16px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .container {
      margin-top: 38px;
      padding: 40px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .notification-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
    }

    .notification-label {
      font-size: 12px;
      font-weight: 300;
      color: #333;
      text-transform: uppercase;
    }

    .custom-radio-check {
      width: 12px;
      height: 12px;
      border: 1px solid #333;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
    }

    .custom-radio-check::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s ease;
    }

    input[type="checkbox"] {
      display: none;
    }

    input[type="checkbox"]:checked + .custom-radio-check::after {
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

  <button class="btn-retour" onclick="location.href='profil.html'">RETOUR</button>

  <div class="title">Notifications</div>

  <div class="container">
    <label class="notification-option">
      <span class="notification-label">Suivi des commandes</span>
      <input type="checkbox" id="suivi">
      <span class="custom-radio-check" ></span>
    </label>

    <label class="notification-option">
      <span class="notification-label">Promotions et nouveautés</span>
      <input type="checkbox" id="promos">
      <span class="custom-radio-check" ></span>
    </label>

    <label class="notification-option">
      <span class="notification-label">Alertes de réapprovisionnement</span>
      <input type="checkbox" id="alertes">
      <span class="custom-radio-check" ></span>
    </label>
  </div>

  <script>
    document.querySelectorAll('.custom-radio-check').forEach(check => {
    check.addEventListener('click', () => {
      const checkbox = check.previousElementSibling;
      checkbox.checked = !checkbox.checked;
    });
  });
  </script>

</body>
</html>
