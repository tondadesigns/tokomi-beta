<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un compte – Tokomi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      background-color: #fff;
      height: 100vh;
      display: flex;
    }
    .btn-retour {
      position: absolute;
      left: 44px;
      top: 104px;
      background: none;
      border: none;
      font-size: 30px;
      font-weight: 300;
      color: black;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }
    .page-container {
  max-width: 460px; /* Ajuste à 390px, 420px, etc. selon ton besoin */
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: row;
  height: 100vh;
}

    .form-container,
.social-container {
  margin-left: 122px; /* ajuste à 24px ou 48px selon besoin */
}

    .form-container {
      flex: 1;
      padding: 64px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      
    }

    .form-container h2 {
      font-size: 32px;
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .form-group {
      font-size: 32px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;

    }

    .form-group label {
      font-size: 26px;
      font-weight: 300;
      margin-bottom: 4px;
    }

    .form-group input {
      padding: 8px 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 300;
      text-transform: uppercase;
      margin-bottom: 1px;
      border: none !important;
      border-bottom: 1px solid #eee !important;
      border-top: transparent;
      border-left: transparent;
      border-right: transparent;
      border-radius: 0;
      outline: none;
    }

  

    .submit-btn {
      margin-top: 24px;
      padding: 20px 40px;
      font-size: 32px;
      font-weight: 300 !important;
      text-transform: uppercase;
      font-weight: 500;
      background-color: black;
      color: white;
      border: none;
      border-radius: 0;
      cursor: pointer;
      width: 110%;

    }

    .submit-btn:hover {
      font-weight: 300;
      background-color: #333;
    }

    .social-container {
      flex: 1;
      padding: 64px 48px;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .social-container h3 {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 16px;
      margin-left: -204px;
    }

    .social-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background-color: white;
      
       border: none !important;
      border-bottom: 1px solid #eee !important;
      border-top: transparent;
      border-left: transparent;
      border-right: transparent;
      border-radius: 0;
      padding: 10px 20px;
      width: 260px;
      margin: 8px 0;
      font-size: 27px;
      font-weight: 300;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease;
      color: black;
    }

    .social-button:hover {
      background-color: #f0f0f0;
    }

    .social-button img {
      background: white;
      height: 20px;
      width: 24px;
      margin-right: 12px;
    }
    .social-button.apple img {
      width: 40px;
      height: 32px;
      margin-left: -8px;
    }
    .social-button.google img {
     margin-left: 0px 
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 999;
    }

    .modal-content {
      background-color: white;
      font-size: 12px;
      font-weight: 300;
      width: 100%;
      border-radius: 0;
      padding: 24px;
      text-align: center;
      animation: slideUp 0.4s ease forwards;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <button class="btn-retour" onclick="location.href='intro-utilisateur.html'">RETOUR</button>
  <div class="form-container">
    <h2>Mon compte</h2>
    <form onsubmit="showModal(event)">
      <div class="form-group">
        <label for="first-name" style="color: grey; font-size: 300;">Prénom</label>
        <input type="text" id="first-name" name="first-name" required>
      </div>
      <div class="form-group">
        <label for="last-name" style="color: grey; font-size: 300;" >Nom</label>
        <input type="text" id="last-name" name="last-name" required>
      </div>
      <div class="form-group">
        <label for="last-name" style="color: grey; font-size: 300;" >Adresse postale</label>
        <input type="text" id="last-name" name="last-name" required>
      </div>
      <div class="form-group">
        <label for="email" style="color: grey; font-size: 300;">Adresse e-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="email" style="color: grey; font-size: 300;">Téléphone</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9+\\s]{6,20}" >
      </div>
      <div class="form-group">
        <label for="password" style="color: grey; font-size: 300;">Mot de passe</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="submit-btn">Valider</button>
    </form>
  </div>

  <div class="social-container">
    <h3>VIA</h3>
    <button class="social-button apple" onclick="window.location.href='https://appleid.apple.com/'"><img src="apple-logo.png" alt="Apple"> Apple</button>
    <button class="social-button google" onclick="window.location.href='https://accounts.google.com/'"><img src="google-logo.png" alt="Google"> Google</button>
    <button class="social-button facebook" onclick="window.location.href='https://www.facebook.com/login/'"><img src="facebook-logo.png" alt="Facebook"> Facebook</button>
  </div>

  <div class="modal-overlay" id="confirmationModal">
    <div class="modal-content">
      <p>Merci, vous allez recevoir un message de confirmation à l'adresse email fournie.</p>
    </div>
  </div>
  <script>
    function showModal(event) {
      event.preventDefault();
      const modal = document.getElementById('confirmationModal');
    modal.style.display = 'flex';

    // Redirection vers la page d’accueil après 2,5 secondes
    setTimeout(() => {
      window.location.href = 'accueil.html'; // remplace par ta page d'accueil réelle si besoin
    }, 2500);
    }
  </script>
</body>
</html>
