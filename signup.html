<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title data-i18n-title="signup.title" >Créer un compte – Tokomi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      background-color: #fff;
      height: 100vh;
      display: flex;
    }
    .btn-retour {
      position: absolute;
      left: 44px;
      top: 104px;
      background: none;
      border: none;
      font-size: 30px;
      font-weight: 300;
      color: black;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
    }
    .page-container {
  max-width: 460px; /* Ajuste à 390px, 420px, etc. selon ton besoin */
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: row;
  height: 100vh;
}

    .form-container,
.social-container {
  margin-left: 122px; /* ajuste à 24px ou 48px selon besoin */
}

    .form-container {
      flex: 1;
      padding: 64px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      
    }

    .form-container h2 {
      font-size: 32px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 82px;
    }

    .form-group {
      font-size: 32px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;

    }

    .form-group label {
      font-size: 30px;
      font-weight: 300;
      margin-bottom: 4px;
    }

    .form-group input {
      padding: 8px 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 300;
      text-transform: uppercase;
      margin-bottom: 1px;
      border: none !important;
      border-bottom: 1px solid #eee !important;
      border-top: transparent;
      border-left: transparent;
      border-right: transparent;
      border-radius: 0;
      outline: none;
    }

  

    .submit-btn {
      margin-top: 24px;
      padding: 20px 40px;
      font-size: 32px;
      font-weight: 300 !important;
      text-transform: uppercase;
      font-weight: 500;
      background-color: black;
      color: white;
      border: none;
      border-radius: 0;
      cursor: pointer;
      width: 100%;

    }

    .submit-btn:hover {
      font-weight: 300;
      background-color: #333;
    }

    .social-container {
      flex: 1;
      padding: 64px 48px;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .social-container h3 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      margin-left: -204px;
    }

    .social-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background-color: white;
      
       border: none !important;
      border-bottom: 1px solid #eee !important;
      border-top: transparent;
      border-left: transparent;
      border-right: transparent;
      border-radius: 0;
      padding: 10px 20px;
      width: 260px;
      margin: 8px 0;
      font-size: 30px;
      font-weight: 300;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease;
      color: black;
    }

    .social-button:hover {
      background-color: #f0f0f0;
    }

    .social-button img {
      background: white;
      height: 24px;
      width: 24px;
      margin-right: 12px;
    }
    .social-button.apple img {
      width: 64px;
      height: 44px;
      margin-left: -12px;
      margin-bottom: 2px;
    }
    .social-button.google img {
     margin-left: -2px;
      width: 46px;
      height: 38px;
    }

    .social-button.facebook img {
    width: 44px;
      height: 40px;
    }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 999;
    }

    .modal-content {
      background-color: white;
      font-size: 28px;
      font-weight: 300;
      width: 100%;
      border-radius: 0;
      padding: 24px;
      text-align: center;
      animation: slideUp 0.4s ease forwards;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }
  </style>
  <!-- i18n -->
  <script defer src="i18n/translations.js"></script>
  <script defer src="i18n/i18n.js"></script>
  <script defer src="i18n/tokomi-i18n-compat.js"></script>
</head>
<body>
  <button class="btn-retour" onclick="location.href='intro-utilisateur.html'" data-i18n="common.back">RETOUR</button>
  <div class="form-container">
    <h2 data-i18n="signup.heading">Mon compte</h2>
    <form id="signupForm" onsubmit="showModal(event)">
      <div class="form-group">
        <label for="first-name" data-i18n="signup.labels.firstName" style="color: grey; font-size: 300;">Prénom</label>
        <input type="text" id="first-name" name="first-name" required.data-i18n-placeholder="signup.labels.firstName"  placeholder="Prénom">
      </div>
      <div class="form-group">
        <label for="last-name" data-i18n="signup.labels.lastName" style="color: grey; font-size: 300;" >Nom</label>
        <input type="text" id="last-name" name="last-name" required  data-i18n-placeholder="signup.labels.lastName" placeholder="Nom">
      </div>
      <div class="form-group">
        <label for="address1" data-i18n="signup.labels.address"style="color: grey; font-size: 300;" >Adresse postale</label>
        <input type="text" id="address1" name="address1" required data-i18n-placeholder="signup.labels.address" placeholder="Adresse postale">
      </div>
      <div class="form-group">
        <label for="email" data-i18n="auth.userLabel" style="color: grey; font-size: 300;">Adresse e-mail</label>
        <input type="email" id="email" name="email" required data-i18n-placeholder="auth.userPlaceholder" placeholder="Adresse e-mail">
      </div>
      <div class="form-group">
        <label for="phone" data-i18n="signup.labels.phone" style="color: grey; font-size: 300;">Téléphone</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9+\\s]{6,20}" data-i18n-placeholder="signup.labels.phone" placeholder="Téléphone">
      </div>
      <div class="form-group">
        <label for="password" data-i18n="auth.passLabel" style="color: grey; font-size: 300;">Mot de passe</label>
        <input type="password" id="password" name="password" required data-i18n-placeholder="auth.passPlaceholder" placeholder="Mot de passe">
      </div>
      <button type="submit" class="submit-btn" data-i18n="signup.submitCta">Valider</button>
    </form>
  </div>

  <div class="social-container">
    <h3 data-i18n="signup.via">VIA</h3>
    <button class="social-button apple" onclick="window.location.href='https://appleid.apple.com/'"><img src="apple-logo.png" alt="Apple"> Apple</button>
    <button class="social-button google" onclick="window.location.href='https://accounts.google.com/'"><img src="google-logo.png" alt="Google"> Google</button>
    <button class="social-button facebook" onclick="window.location.href='https://www.facebook.com/login/'"><img src="facebook-logo.png" alt="Facebook"> Facebook</button>
  </div>

  <div class="modal-overlay" id="confirmationModal">
    <div class="modal-content">
      <p data-i18n="signup.modalThanks">Merci, vous allez recevoir un message de confirmation à l'adresse email fournie.</p>
    </div>
  </div>
  <script>
  function showModal() {
    const modal = document.getElementById('confirmationModal');
    if (modal) modal.style.display = 'flex';
  }

  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();

    const data = {
      prenom:    document.getElementById('first-name')?.value.trim() || "",
      nom:       document.getElementById('last-name')?.value.trim()  || "",
      adresse:   document.getElementById('address1')?.value.trim()   || "",
      email:     document.getElementById('email')?.value.trim()      || "",
      telephone: document.getElementById('phone')?.value.trim()      || "",
      password:  document.getElementById('password')?.value.trim()   || ""
    };

    // Sauvegarde
    localStorage.setItem('signupData', JSON.stringify(data));
    localStorage.setItem('tokomi_auth', 'user');      // connecté

      // Objet utilisateur centralisé (priorité au prénom)
    const existingUser = JSON.parse(localStorage.getItem('tokomiUser') || '{}');
    const full = `${data.prenom} ${data.nom}`.trim();

    const user = {
      ...existingUser,
      firstName: data.prenom,
      name: existingUser.name || full,
      fullName: existingUser.fullName || full,
      email: data.email,
      phone: data.telephone,
      address1: data.adresse
    };
    localStorage.setItem('tokomiUser', JSON.stringify(user));
    
    localStorage.setItem('tokomi_user_name', data.prenom);// prénom = username si besoin
    localStorage.setItem('tokomiUserName', data.prenom);
    localStorage.setItem('username', data.prenom);
    localStorage.setItem

    try {
  TokomiSession.login({
    email:     data.email,
    firstName: data.prenom,
    lastName:  data.nom
  });
} catch(e) {}

    
    // UI: modal de confirmation puis redirection
    showModal();
    setTimeout(() => {
      window.location.href = 'accueil.html';
    }, 2500); // délai court pour l'effet visuel
  });
</script>



</body>
</html>
